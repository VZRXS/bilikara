[package]
name = "bilikara-media-gstreamer-poc"
version = "0.1.0"
edition = "2021"
publish = false

# Deliberately outside the production Cargo graph and packaged payloads.
[workspace]

[dependencies]
gstreamer = { version = "=0.23.7", features = ["v1_20"] }
gstreamer-app = { version = "=0.23.5", features = ["v1_20"] }
gstreamer-video = { version = "=0.23.6", features = ["v1_20"] }
serde_json = "=1.0.145"

[build-dependencies]
cc = "=1.2.46"

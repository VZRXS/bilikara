name: Desktop

on:
  workflow_call:
    inputs:
      bundle_version:
        type: string
        default: ''

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    env:
      # Preserve file/line backtraces without full variable/type debug data.
      # This only affects CI checks/tests, never the release profile.
      CARGO_PROFILE_DEV_DEBUG: "line-tables-only"
      CARGO_PROFILE_TEST_DEBUG: "line-tables-only"
    strategy:
      fail-fast: false
      matrix:
        os: ["ubuntu-latest", "windows-latest", "macos-latest"]
        python-version:
          - "3.11"

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install locked Node dependencies
        run: npm ci

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-packaging.txt

      - name: Install Tauri system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf ffmpeg

      - name: Setup repository Rust toolchain
        uses: ./.github/actions/rust-toolchain

      - name: Cache Rust builds
        id: rust-cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            ./rust -> target
            ./rust-runtime -> target
            ./src-tauri -> target
            ./xtask -> target
          # Retain our crates as well as dependencies; Cargo still validates them.
          cache-workspace-crates: true
          # Separate feature sets; rotate once because exact hits are immutable.
          shared-key: ci-test-workspace-v1

      - name: Desktop construction tool checks
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --manifest-path xtask/Cargo.toml --check
          cargo clippy --manifest-path xtask/Cargo.toml --all-targets --locked --target host-tuple -- -D warnings
          cargo test --manifest-path xtask/Cargo.toml --locked --target host-tuple
          cargo build --manifest-path xtask/Cargo.toml --locked --target host-tuple
          npm run test:desktop-build
          npm run test:libav-wrapper
          npm run test:media-entry
          npm run test:native-host-entry
          npm run test:native-media-entry
          npm run test:auxiliary

      - name: Rust Checks and Build
        shell: bash
        run: |
          set -euo pipefail
          cd rust
          cargo fmt --check
          cargo clippy --all-targets --locked -- -D warnings
          cargo test --locked
          cargo build --release --locked
          cd ../rust-runtime
          cargo fmt --check
          cargo clippy --all-targets --locked -- -D warnings
          cargo test --locked
          cargo build --release --locked
          cd ../src-tauri
          cargo fmt --check
          cargo clippy --all-targets --locked -- -D warnings
          cargo test --locked
          cargo build --release --locked
          cd ..

      - name: Verify offline desktop data import
        shell: bash
        run: |
          set -euo pipefail
          cargo test --manifest-path rust-runtime/Cargo.toml --features native-host --locked --target host-tuple --lib native_host::desktop_import
          npm run test:native-import

      - name: Verify frontend and native shell test tooling
        shell: bash
        run: |
          set -euo pipefail
          # Actual locked manifest checks run after the native Cargo graphs exist.
          npm run test:frontend
          npm run test:native-smoke

      - name: Compile Python files
        run: |
          python -m compileall -q bilikara

      - name: Test release mirror verification
        run: node --test tests/release_mirror.test.mjs

      - name: Test native YouTube quick-request contract
        run: node --test tests/youtube_quick_request.test.mjs

      - name: Resolve Linux media test cache identity
        if: runner.os == 'Linux'
        id: test-libav-key
        env:
          BILIKARA_LIBAV_PREFIX: ${{ runner.temp }}/bilikara-test-libav
        run: cargo run --manifest-path xtask/Cargo.toml --locked --target host-tuple -- libav-cache key >> "$GITHUB_OUTPUT"

      - name: Cache verified Linux media test libraries
        if: runner.os == 'Linux'
        id: test-libav-cache
        uses: actions/cache@v5
        with:
          path: ${{ runner.temp }}/bilikara-test-libav-cache
          key: ${{ steps.test-libav-key.outputs.key }}

      - name: Build libav prerequisite for packaged media tests
        if: runner.os == 'Linux'
        env:
          BILIKARA_LIBAV_PREFIX: ${{ runner.temp }}/bilikara-test-libav
          BILIKARA_LIBAV_CACHE: ${{ runner.temp }}/bilikara-test-libav-cache
          BILIKARA_LIBAV_CACHE_HIT: ${{ steps.test-libav-cache.outputs.cache-hit }}
        run: |
          # This suite loads only the companion. Release drivers/test binaries
          # and packaging records are built by the desktop bundle jobs.
          bash media-libav/build-posix-libraries.sh
          cargo run --manifest-path xtask/Cargo.toml --locked --target host-tuple -- libav-companion --prefix "$BILIKARA_LIBAV_PREFIX" --out "$BILIKARA_LIBAV_PREFIX/bin" --test
          echo "BILIKARA_TEST_LIBAV_COMPANION=$BILIKARA_LIBAV_PREFIX/bin/libbilikara_media_libav.so" >> "$GITHUB_ENV"

      - name: Verify real libav prerequisite contracts
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          npm run test:libav-prerequisites

      - name: Run unit tests
        run: |
          python -m unittest discover -s tests -v
        env:
          BILIKARA_REQUIRE_RUST_LIB: "1"
          BILIKARA_RUST_STRICT_EQUIVALENCE: "1"

      - name: Verify native desktop business workflows
        shell: bash
        run: |
          set -euo pipefail
          # Node selects the actual current locked host-native Cargo artifact.
          # Linux media/cookie tests require the prefix exported above.
          npm run test:playlist-entry
          npm run test:native-transport-entry
          npm run test:native-host
          npm run test:native-http
          npm run test:native-catalog
          npm run test:catalog-maintenance
          npm run test:native-qr
          npm run test:native-images
          npm run test:native-login
          npm run test:remote-load

      - name: Verify rendered native ratings and media workflows
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          # Test-only pinned browser, after the native compiler graphs/prefix.
          # FFmpeg above generates only synthetic test media; not bundled.
          npm exec -- playwright install --with-deps chromium webkit
          npm run test:native-users
          npm run test:native-ratings
          npm run test:host-experience
          npm run test:app-updates
          npm run test:native-transport
          npm run test:native-media

      - name: Summarize build caches
        if: always()
        shell: bash
        env:
          RUST_CACHE_HIT: ${{ steps.rust-cache.outputs.cache-hit }}
          LIBAV_CACHE_HIT: ${{ steps.test-libav-cache.outputs.cache-hit }}
          LIBAV_CACHE_KEY: ${{ steps.test-libav-key.outputs.key }}
        run: |
          printf '### Build caches\n\n| Cache | Exact hit |\n| --- | --- |\n| Rust | `%s` |\n| libav | `%s` |\n\nlibav key: `%s`\n\nSee restore/save logs and step timings for details.\n' "${RUST_CACHE_HIT:-unavailable}" "${LIBAV_CACHE_HIT:-unavailable}" "${LIBAV_CACHE_KEY:-unavailable}" >> "$GITHUB_STEP_SUMMARY"

  bundle:
    name: Bundle (${{ matrix.label }})
    needs: test
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: ${{ matrix.os }}
    env:
      BILIKARA_EXPECT_RELEASE_VERSION: ${{ github.ref_type == 'tag' && github.ref_name || inputs.bundle_version || '' }}
      # A manual run may label its desktop bundle; upload/release steps stay tag-only.
      BILIKARA_VERSION: ${{ github.event_name == 'workflow_dispatch' && inputs.bundle_version || '' }}
    strategy:
      fail-fast: false
      matrix:
        include: [{"os": "windows-latest", "label": "Windows x64", "slug": "windows", "arch": "x64"}, {"os": "windows-11-arm", "label": "Windows ARM64", "slug": "windows", "arch": "arm64"}, {"os": "macos-latest", "label": "macOS ARM64", "slug": "macos", "arch": "arm64"}, {"os": "macos-15-intel", "label": "macOS Intel", "slug": "macos", "arch": "x64"}]


    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Resolve bundle archive name
        id: bundle-name
        shell: bash
        env:
          BUNDLE_SLUG: ${{ matrix.slug }}
          BUNDLE_ARCH: ${{ matrix.arch }}
        run: |
          if [ -n "${BILIKARA_VERSION:-}" ] && ! printf '%s' "$BILIKARA_VERSION" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+(-preview\.[0-9]+)?$'; then
            echo "bundle_version must look like v0.8.0 or v0.8.0-preview.3" >&2
            exit 1
          fi
          ref_name="${BILIKARA_VERSION:-${GITHUB_REF_NAME:-local}}"
          safe_ref="$(printf '%s' "$ref_name" | sed -E 's/[^A-Za-z0-9._-]+/-/g; s/^-+//; s/-+$//')"
          if [ -z "$safe_ref" ]; then
            safe_ref="local"
          fi
          if [ "${GITHUB_REF_TYPE:-branch}" = "tag" ] || [ -n "${BILIKARA_VERSION:-}" ]; then
            artifact_name="bilikara-${safe_ref}-${BUNDLE_SLUG}-${BUNDLE_ARCH}"
          else
            artifact_name="bilikara-${BUNDLE_SLUG}-${BUNDLE_ARCH}-${safe_ref}"
          fi
          archive_name="${artifact_name}.zip"
          echo "archive_name=$archive_name" >> "$GITHUB_OUTPUT"
          echo "artifact_name=$artifact_name" >> "$GITHUB_OUTPUT"
          echo "BUNDLE_ARCHIVE=$archive_name" >> "$GITHUB_ENV"

      - name: Select native libav build prefix
        shell: bash
        run: |
          echo "BILIKARA_LIBAV_PREFIX=$RUNNER_TEMP/bilikara-libav" >> "$GITHUB_ENV"
          echo "BILIKARA_LIBAV_CACHE=$RUNNER_TEMP/bilikara-libav-cache" >> "$GITHUB_ENV"

      - name: Install macOS source verification tools
        if: runner.os == 'macOS'
        run: brew list gnupg >/dev/null 2>&1 || brew install gnupg

      - name: Setup repository Rust toolchain
        uses: ./.github/actions/rust-toolchain

      - name: Cache Rust builds
        id: rust-cache
        uses: Swatinem/rust-cache@v2
        with:
          # The native bundle never builds rust/target; it links the core through Runtime.
          workspaces: |
            ./rust-runtime -> target
            ./src-tauri -> target
            ./xtask -> target
          cache-workspace-crates: true
          shared-key: ci-desktop-bundle-workspace-v1

      - name: Setup native MSVC environment
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/setup_msvc.ps1 -Arch '${{ matrix.arch }}'

      - name: Prepare pinned BBDown vendor
        shell: bash
        run: |
          bbdown_dir="$RUNNER_TEMP/bilikara-bbdown-vendor"
          cargo run --manifest-path xtask/Cargo.toml --locked --target host-tuple -- prepare-bbdown "$bbdown_dir" --platform '${{ matrix.slug }}' --arch '${{ matrix.arch }}'
          printf '%s\n' "$bbdown_dir/bin" >> "$GITHUB_PATH"
          cat "$bbdown_dir/metadata.env" >> "$GITHUB_ENV"

      - name: Verify prepared BBDown discovery from native environment
        shell: bash
        env:
          BILIKARA_TEST_BBDOWN_DIR: ${{ runner.temp }}/bilikara-bbdown-vendor
        run: cargo test --manifest-path xtask/Cargo.toml --locked --target host-tuple prepared_bbdown_is_discoverable_from_native_environment -- --ignored

      - name: Resolve libav cache identity
        id: libav-cache-key
        shell: bash
        run: cargo run --manifest-path xtask/Cargo.toml --locked --target host-tuple -- libav-cache key >> "$GITHUB_OUTPUT"

      - name: Verify native MSVC companion path handling
        if: runner.os == 'Windows'
        shell: bash
        run: cargo test --manifest-path xtask/Cargo.toml --locked --target host-tuple windows_msvc_companion_paths_compile_generated_header -- --ignored

      - name: Restore verified libav libraries
        id: libav-cache
        uses: actions/cache/restore@v5
        with:
          path: ${{ env.BILIKARA_LIBAV_CACHE }}
          key: ${{ steps.libav-cache-key.outputs.key }}

      - name: Select libav cache result
        shell: bash
        run: echo "BILIKARA_LIBAV_CACHE_HIT=${{ steps.libav-cache.outputs.cache-hit }}" >> "$GITHUB_ENV"

      - name: Setup MSVC build shell
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@v2
        with:
          msystem: MSYS
          path-type: inherit
          install: make diffutils pkgconf perl nasm curl gnupg

      - name: Build Windows libav libraries and companion
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: bash media-libav/build-windows.sh

      - name: Prepare native driver and PE dependencies
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./media-libav/prepare-windows.ps1

      - name: Build POSIX libav libraries and companion
        if: runner.os == 'macOS'
        run: bash media-libav/build-posix.sh

      - name: Verify native AVC timestamp preservation
        shell: bash
        run: |
          set -euo pipefail
          case "$RUNNER_OS" in
            Windows) companion="$BILIKARA_LIBAV_PREFIX/bin/bilikara_media_libav.dll" ;;
            macOS) companion="$BILIKARA_LIBAV_PREFIX/bin/libbilikara_media_libav.dylib" ;;
            *) exit 1 ;;
          esac
          companion="$(node -e 'process.stdout.write(require("node:fs").realpathSync.native(process.argv[1]))' "$companion")"
          BILIKARA_LIBAV_COMPANION="$companion" cargo test --manifest-path rust-runtime/Cargo.toml --locked --target host-tuple --lib experimental_libav::remux::package_tests::reordered_video_preserves_nonzero_start -- --exact --ignored

      - name: Save verified libav libraries
        if: steps.libav-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: ${{ env.BILIKARA_LIBAV_CACHE }}
          key: ${{ steps.libav-cache-key.outputs.key }}

      - name: Build release backend from prepared dependencies
        run: cargo run --manifest-path xtask/Cargo.toml --locked --target host-tuple -- build-backend
        env:
          BILIKARA_REQUIRE_RUST_LIB: "1"

      - name: Verify native backend and bundled tools on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $files = Get-ChildItem -Path dist/bilikara -Recurse -File
          foreach ($library in @('bilikara-desktop-host.exe', 'bilikara-updater.exe', 'native-desktop.json')) {
            if (-not ($files | Where-Object Name -eq $library)) {
              throw "Packaged Rust library was not found: $library"
            }
          }
          foreach ($tool in @('BBDown.exe')) {
            $vendor = $files | Where-Object { $_.Name -eq $tool -and $_.FullName -match '[\\/]vendor[\\/]' } | Select-Object -First 1
            if (-not $vendor) {
              throw "Packaged vendor tool was not found: $tool"
            }
            if ($tool -eq 'BBDown.exe') {
              & $vendor.FullName --help
            } else {
              & $vendor.FullName -version
            }
            if ($LASTEXITCODE -ne 0) {
              throw "Packaged vendor tool execution failed: $tool"
            }
          }

      - name: Verify native backend and bundled tools on macOS
        if: runner.os == 'macOS'
        run: |
          test -x dist/bilikara.app/Contents/MacOS/bilikara-desktop-host
          test -x dist/bilikara.app/Contents/MacOS/bilikara-updater
          test -f dist/bilikara.app/Contents/Resources/native-desktop.json
          # Native code lives in Frameworks; the runtime resource path is a relative symlink.
          bbdown_vendor="dist/bilikara.app/Contents/Resources/vendor/BBDown"
          test -x "$bbdown_vendor"
          "$bbdown_vendor" --help

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Build Tauri App on Windows
        if: runner.os == 'Windows'
        run: |
          npm ci
          npm exec -- tauri icon static/pic/icon.png
          npm exec -- tauri build --no-bundle -- --locked

      - name: Build Tauri App on macOS
        if: runner.os == 'macOS'
        run: |
          npm ci
          npm exec -- tauri icon static/pic/icon.png
          npm exec -- tauri build --bundles app -- --locked

      - name: Assemble release desktop using the compiled Tauri output
        # Cargo metadata locates the existing release output. No shell rebuild.
        run: cargo run --manifest-path xtask/Cargo.toml --locked --target host-tuple -- assemble-desktop

      - name: Stage and verify macOS bundles
        if: runner.os == 'macOS'
        run: |
          mkdir -p dist_release
          ditto dist/bilikara-desktop.app dist_release/bilikara-desktop.app
          ln -s bilikara-desktop.app/Contents/Frameworks/bilikara-backend.app/Contents/Resources/license dist_release/license
          test ! -e dist_release/bilikara.app
          test -s dist_release/license/LICENSE
          cp README-macOS.txt dist_release/README-macOS.txt
          cp 'dist/导入旧数据.command' 'dist_release/导入旧数据.command'
          test -x 'dist_release/导入旧数据.command'
          test -s dist_release/README-macOS.txt
          node scripts/check_macos_bundle_readme.mjs dist_release/README-macOS.txt

          echo "=== Verifying staged bilikara-desktop.app ==="
          test -x dist_release/bilikara-desktop.app/Contents/MacOS/bilikara
          embedded_backend="dist_release/bilikara-desktop.app/Contents/Frameworks/bilikara-backend.app"
          test -x "$embedded_backend/Contents/MacOS/bilikara-desktop-host"
          test -x "$embedded_backend/Contents/MacOS/bilikara-updater"
          plutil -lint dist_release/bilikara-desktop.app/Contents/Info.plist
          plutil -lint "$embedded_backend/Contents/Info.plist"
          codesign --verify --deep --strict --verbose=4 "$embedded_backend"
          codesign --verify --deep --strict --verbose=4 dist_release/bilikara-desktop.app
          codesign -dv --verbose=4 dist_release/bilikara-desktop.app

          echo "=== Architecture checks ==="
          file dist_release/bilikara-desktop.app/Contents/MacOS/bilikara
          file "$embedded_backend/Contents/MacOS/bilikara-desktop-host"
          test "$(lipo -archs dist_release/bilikara-desktop.app/Contents/MacOS/bilikara)" = "$(lipo -archs "$embedded_backend/Contents/MacOS/bilikara-desktop-host")"

          echo "=== Locked aria2c metadata-only checks ==="
          aria2_metadata="$embedded_backend/Contents/Resources/vendor/aria2-macos.json"
          test -f "$aria2_metadata"
          expected_arch="$(node -p 'process.arch')"
          node scripts/tool_asset_metadata.mjs check "$aria2_metadata" "$expected_arch"
          unexpected_aria2="$(find dist_release -type f \( -name aria2c -o -name aria2c.exe \) -print)"
          if [ -n "$unexpected_aria2" ]; then
            echo "Unexpected bundled aria2c executable candidate(s):" >&2
            printf '%s\n' "$unexpected_aria2" >&2
            exit 1
          fi


      - name: Archive Windows bundle
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path dist/bilikara -DestinationPath $env:BUNDLE_ARCHIVE

      - name: Verify extracted Windows bundle
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $extracted = Join-Path $env:RUNNER_TEMP 'Bilikara preview 空'
          Expand-Archive -Path $env:BUNDLE_ARCHIVE -DestinationPath $extracted
          $package = Join-Path $extracted 'bilikara'
          foreach ($required in @('_internal/bilikara-desktop-host.exe', '_internal/bilikara-updater.exe', 'bilikara-desktop.exe', '_internal/vendor/bilikara_media_libav.dll', '_internal/native-desktop.json', 'license/LICENSE')) {
            if (-not (Test-Path (Join-Path $package $required))) {
              throw "Extracted bundle is missing $required"
            }
          }
          $entries = @(Get-ChildItem -LiteralPath $package | ForEach-Object { $_.Name } | Sort-Object)
          $expectedEntries = @('_internal', 'bilikara-desktop.exe', 'license', '导入旧数据.cmd')
          if ($entries.Count -ne $expectedEntries.Count -or @($expectedEntries | Where-Object { $_ -notin $entries }).Count -ne 0) {
            throw "Unexpected outer package entries: $entries"
          }
          foreach ($buildOnly in @('_internal/preview', '_internal/libav-smoke.ps1', '_internal/libav-smoke-result.json', '_internal/vendor/bilikara_media_libav_test.dll')) {
            if (Test-Path (Join-Path $package $buildOnly)) {
              throw "Build-only validation payload leaked into archive: $buildOnly"
            }
          }

      - name: Archive and verify round-trip macOS bundle
        if: runner.os == 'macOS'
        run: |
          ditto -c -k --sequesterRsrc --keepParent dist_release "$BUNDLE_ARCHIVE"

          mkdir -p test_extract
          ditto -x -k "$BUNDLE_ARCHIVE" test_extract/
          test -s test_extract/dist_release/README-macOS.txt
          test -x 'test_extract/dist_release/导入旧数据.command'
          cmp 'dist/导入旧数据.command' 'test_extract/dist_release/导入旧数据.command'
          test ! -e test_extract/dist_release/bilikara.app
          test -L test_extract/dist_release/license
          test "$(readlink test_extract/dist_release/license)" = bilikara-desktop.app/Contents/Frameworks/bilikara-backend.app/Contents/Resources/license
          test -s test_extract/dist_release/license/LICENSE
          cmp README-macOS.txt test_extract/dist_release/README-macOS.txt
          test ! -e test_extract/dist_release/bilikara-desktop.app/Contents/Frameworks/bilikara-backend.app/Contents/Resources/libav-diagnostics
          test ! -e test_extract/dist_release/bilikara-desktop.app/Contents/Frameworks/bilikara-backend.app/Contents/Frameworks/libbilikara_media_libav_test.dylib

          echo "=== Verifying extracted bilikara-desktop.app ==="
          test -x test_extract/dist_release/bilikara-desktop.app/Contents/MacOS/bilikara
          extracted_embedded_backend="test_extract/dist_release/bilikara-desktop.app/Contents/Frameworks/bilikara-backend.app"
          test -x "$extracted_embedded_backend/Contents/MacOS/bilikara-desktop-host"
          test -x "$extracted_embedded_backend/Contents/MacOS/bilikara-updater"
          plutil -lint test_extract/dist_release/bilikara-desktop.app/Contents/Info.plist
          plutil -lint "$extracted_embedded_backend/Contents/Info.plist"
          codesign --verify --deep --strict --verbose=4 "$extracted_embedded_backend"
          codesign --verify --deep --strict --verbose=4 test_extract/dist_release/bilikara-desktop.app
          codesign -dv --verbose=4 test_extract/dist_release/bilikara-desktop.app
          test "$(lipo -archs test_extract/dist_release/bilikara-desktop.app/Contents/MacOS/bilikara)" = "$(lipo -archs "$extracted_embedded_backend/Contents/MacOS/bilikara-desktop-host")"

          extracted_aria2_metadata="$extracted_embedded_backend/Contents/Resources/vendor/aria2-macos.json"
          test -f "$extracted_aria2_metadata"
          node scripts/tool_asset_metadata.mjs check "$extracted_aria2_metadata" "$(node -p 'process.arch')"
          unexpected_aria2="$(find test_extract/dist_release -type f \( -name aria2c -o -name aria2c.exe \) -print)"
          if [ -n "$unexpected_aria2" ]; then
            echo "Unexpected archived aria2c executable candidate(s):" >&2
            printf '%s\n' "$unexpected_aria2" >&2
            exit 1
          fi


      - name: Verify extracted native desktop and no-media-CLI layout on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $backend = Join-Path $env:RUNNER_TEMP 'Bilikara preview 空/bilikara/_internal/bilikara-desktop-host.exe'
          cargo run --manifest-path xtask/Cargo.toml --locked --target host-tuple -- verify-native-desktop "$backend"
          if ($LASTEXITCODE -ne 0) { throw "Extracted native desktop verification failed" }
          $env:BILIKARA_TEST_NATIVE_PACKAGE = $backend
          cargo test --manifest-path xtask/Cargo.toml --locked --target host-tuple native_package::installed:: -- --ignored --nocapture
          if ($LASTEXITCODE -ne 0) { throw "Extracted installed-entry regressions failed" }

      - name: Verify extracted native desktop and no-media-CLI layout on macOS
        if: runner.os == 'macOS'
        run: |
          backend="$GITHUB_WORKSPACE/test_extract/dist_release/bilikara-desktop.app/Contents/Frameworks/bilikara-backend.app/Contents/MacOS/bilikara-desktop-host"
          cargo run --manifest-path xtask/Cargo.toml --locked --target host-tuple -- verify-native-desktop "$backend"
          BILIKARA_TEST_NATIVE_PACKAGE="$backend" cargo test --manifest-path xtask/Cargo.toml --locked --target host-tuple native_package::installed:: -- --ignored --nocapture
          BILIKARA_REQUIRE_TAURI_SMOKE=1 BILIKARA_TEST_TAURI_EXE="$GITHUB_WORKSPACE/test_extract/dist_release/bilikara-desktop.app/Contents/MacOS/bilikara" node --test tests/macos_tauri_smoke.test.mjs

      - name: Upload native bundle
        uses: actions/upload-artifact@v7
        with:
          path: ${{ steps.bundle-name.outputs.archive_name }}
          archive: false
          if-no-files-found: error

      - name: Upload bundle to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          files: ${{ steps.bundle-name.outputs.archive_name }}
          generate_release_notes: ${{ contains(github.ref_name, '-preview.') }}
          prerelease: ${{ contains(github.ref_name, '-preview.') }}
          draft: true

      - name: Summarize build caches
        if: always()
        shell: bash
        env:
          RUST_CACHE_HIT: ${{ steps.rust-cache.outputs.cache-hit }}
          LIBAV_CACHE_HIT: ${{ steps.libav-cache.outputs.cache-hit }}
          LIBAV_CACHE_KEY: ${{ steps.libav-cache-key.outputs.key }}
        run: |
          printf '### Build caches\n\n| Cache | Exact hit |\n| --- | --- |\n| Rust | `%s` |\n| libav | `%s` |\n\nlibav key: `%s`\n\nSee restore/save logs and step timings for details.\n' "${RUST_CACHE_HIT:-unavailable}" "${LIBAV_CACHE_HIT:-unavailable}" "${LIBAV_CACHE_KEY:-unavailable}" >> "$GITHUB_STEP_SUMMARY"

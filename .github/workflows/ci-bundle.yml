name: CI And Bundles

on:
  push:
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
          - macos-latest
        python-version:
          - "3.11"

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-packaging.txt

      - name: Install Tauri system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf

      - name: Setup repository Rust toolchain
        run: |
          rustup toolchain install
          rustup show active-toolchain
          rustc --version

      - name: Cache Rust builds
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            ./rust -> target
            ./src-tauri -> target
          shared-key: ci-bundle

      - name: Rust Checks and Build
        run: |
          cd rust
          cargo fmt --check
          cargo clippy --all-targets --locked -- -D warnings
          cargo test --locked
          cargo build --release --locked
          cd ../src-tauri
          cargo fmt --check
          cargo clippy --all-targets --locked -- -D warnings
          cargo test --locked
          cargo build --release --locked
          cd ..

      - name: Compile Python files
        run: |
          python -m compileall -q bilikara
          python -m py_compile start_bilikara.py build_bundle.py

      - name: Run unit tests
        run: python -m unittest discover -s tests -v
        env:
          BILIKARA_REQUIRE_RUST_LIB: "1"
          BILIKARA_RUST_STRICT_EQUIVALENCE: "1"

  bundle:
    name: Bundle (${{ matrix.label }})
    needs: test
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            label: Windows x64
            slug: windows
          - os: windows-11-arm
            label: Windows ARM64
            slug: windows
          - os: macos-latest
            label: macOS ARM64
            slug: macos
          - os: macos-15-intel
            label: macOS Intel
            slug: macos


    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install FFmpeg on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: choco install ffmpeg -y

      - name: Prepare pinned portable FFmpeg asset
        if: runner.os == 'macOS'
        run: |
          set -euo pipefail
          runner_arch="$(python -c "import platform; m=platform.machine().lower(); print('x64' if m in ('amd64','x86_64','x64') else 'arm64' if m in ('arm64','aarch64') else m)")"
          metadata_file="tools/ffmpeg/macos-${runner_arch}.json"
          test -f "$metadata_file"

          python -c 'import json,sys; data=json.load(open(sys.argv[1], encoding="utf-8")); assert data["schema_version"] == 2; assert data["tool"] == "ffmpeg"; assert data["version"] == "8.1.2"; assert data["arch"] == sys.argv[2]; assert data["url"].startswith("https://"); assert len(data["sha256"]) == 64' "$metadata_file" "$runner_arch"

          asset_url="$(python -c 'import json,sys; print(json.load(open(sys.argv[1], encoding="utf-8"))["url"])' "$metadata_file")"
          expected_sha="$(python -c 'import json,sys; print(json.load(open(sys.argv[1], encoding="utf-8"))["sha256"])' "$metadata_file")"

          archive_path="$RUNNER_TEMP/ffmpeg-${runner_arch}.tar.gz"
          portable_ffmpeg_dir="$RUNNER_TEMP/bilikara-portable-ffmpeg"
          mkdir -p "$portable_ffmpeg_dir"

          curl --fail --location --retry 5 --retry-delay 2 --show-error --silent "$asset_url" --output "$archive_path"
          actual_sha="$(shasum -a 256 "$archive_path" | awk '{print $1}')"
          if [ "$actual_sha" != "$expected_sha" ]; then
            echo "FFmpeg asset SHA-256 mismatch: expected $expected_sha, got $actual_sha" >&2
            exit 1
          fi

          tar -xzf "$archive_path" -C "$portable_ffmpeg_dir"

          test -x "$portable_ffmpeg_dir/bin/ffmpeg"
          test -x "$portable_ffmpeg_dir/bin/ffprobe"
          test -f "$portable_ffmpeg_dir/source/ffmpeg-8.1.2.tar.xz"
          test -f "$portable_ffmpeg_dir/licenses/COPYING.LGPLv2.1"

          ffmpeg_ver="$("$portable_ffmpeg_dir/bin/ffmpeg" -version)"
          ffprobe_ver="$("$portable_ffmpeg_dir/bin/ffprobe" -version)"
          if ! printf '%s\n' "$ffmpeg_ver" | grep -F "ffmpeg version 8.1.2" >/dev/null; then
            echo "Unexpected FFmpeg version" >&2
            exit 1
          fi
          if ! printf '%s\n' "$ffprobe_ver" | grep -F "ffprobe version 8.1.2" >/dev/null; then
            echo "Unexpected ffprobe version" >&2
            exit 1
          fi
          if printf '%s\n' "$ffmpeg_ver" | grep -F "--enable-nonfree" >/dev/null; then
            echo "Disallowed --enable-nonfree in FFmpeg build" >&2
            exit 1
          fi

          for tool_binary in "$portable_ffmpeg_dir/bin/ffmpeg" "$portable_ffmpeg_dir/bin/ffprobe"; do
            deps="$(/usr/bin/otool -L "$tool_binary")"
            if printf '%s\n' "$deps" | grep -E '(@rpath|/opt/homebrew/|/usr/local/Cellar/)' >/dev/null; then
              echo "Non-portable dependency in $tool_binary" >&2
              exit 1
            fi
          done

          printf '%s\n' "$portable_ffmpeg_dir/bin" >> "$GITHUB_PATH"
          printf '%s\n' \
            "BILIKARA_FFMPEG_SOURCE_VERSION=8.1.2" \
            "BILIKARA_FFMPEG_SOURCE_URL=https://ffmpeg.org/releases/ffmpeg-8.1.2.tar.xz" \
            "BILIKARA_FFMPEG_SOURCE_SHA256=464beb5e7bf0c311e68b45ae2f04e9cc2af88851abb4082231742a74d97b524c" \
            "BILIKARA_FFMPEG_SOURCE_ARCHIVE=$portable_ffmpeg_dir/source/ffmpeg-8.1.2.tar.xz" \
            "BILIKARA_FFMPEG_LICENSE_FILE=$portable_ffmpeg_dir/licenses/COPYING.LGPLv2.1" \
            >> "$GITHUB_ENV"

      - name: Prepare pinned BBDown vendor
        shell: bash
        run: |
          bbdown_dir="$RUNNER_TEMP/bilikara-bbdown-vendor"
          python scripts/prepare_bbdown_vendor.py "$bbdown_dir"
          printf '%s\n' "$bbdown_dir/bin" >> "$GITHUB_PATH"
          cat "$bbdown_dir/metadata.env" >> "$GITHUB_ENV"

      - name: Install packaging dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-packaging.txt

      - name: Setup repository Rust toolchain
        run: |
          rustup toolchain install
          rustup show active-toolchain
          rustc --version

      - name: Cache Rust builds
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            ./rust -> target
            ./src-tauri -> target
          shared-key: ci-bundle

      - name: Build Rust Backend Library
        run: |
          cd rust
          cargo build --release --locked
          cd ..

      - name: Build app bundle
        run: python build_bundle.py
        env:
          BILIKARA_REQUIRE_RUST_LIB: "1"

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Build Tauri App on Windows
        if: runner.os == 'Windows'
        run: |
          npm ci
          npm exec -- tauri icon static/pic/icon.png
          npm run build

      - name: Build Tauri App on macOS
        if: runner.os == 'macOS'
        run: |
          npm ci
          npm exec -- tauri icon static/pic/icon.png
          npm run build:rust
          npm exec -- tauri build --bundles app -- --locked

      - name: Inject Tauri into Windows Bundle
        if: runner.os == 'Windows'
        shell: pwsh
        run: Copy-Item src-tauri/target/release/bilikara.exe -Destination dist/bilikara/bilikara-desktop.exe


      - name: Inject Tauri into macOS Bundle
        if: runner.os == 'macOS'
        run: ditto src-tauri/target/release/bundle/macos/bilikara.app dist/Bilikara-Desktop.app

      - name: Embed signed backend in macOS Desktop bundle
        if: runner.os == 'macOS'
        run: python scripts/embed_macos_backend.py dist/bilikara.app dist/Bilikara-Desktop.app

      - name: Verify packaged BBDown vendor and clean runtime restore on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $vendor = Get-ChildItem -Path dist/bilikara -Recurse -File -Filter BBDown.exe | Where-Object { $_.FullName -match '[\\/]vendor[\\/]' } | Select-Object -First 1
          if (-not $vendor) { throw 'Packaged BBDown vendor executable was not found' }
          & $vendor.FullName --help
          if ($LASTEXITCODE -ne 0) { throw 'Packaged BBDown vendor version check failed' }
          $runtimeHome = Join-Path $env:RUNNER_TEMP 'bilikara-bbdown-runtime-smoke'
          if (Test-Path $runtimeHome) { Remove-Item -Recurse -Force $runtimeHome }
          New-Item -ItemType Directory -Path $runtimeHome | Out-Null
          $env:BILIKARA_HOME = $runtimeHome
          # The PyInstaller backend uses the Windows GUI subsystem, so invoking it
          # directly from PowerShell can return before the smoke process exits.
          $smoke = Start-Process -FilePath dist/bilikara/bilikara.exe -ArgumentList @('--tool-smoke', 'bbdown') -Wait -PassThru
          if ($smoke.ExitCode -ne 0) { throw "Packaged BBDown runtime restore smoke failed with exit code $($smoke.ExitCode)" }
          $runtime = Join-Path $runtimeHome 'tools/bbdown/BBDown.exe'
          if (-not (Test-Path $runtime)) { throw "Runtime BBDown was not restored: $runtime" }
          & $runtime --help
          if ($LASTEXITCODE -ne 0) { throw 'Restored BBDown version check failed' }

      - name: Resolve bundle archive name
        id: bundle-name
        shell: bash
        run: |
          ref_name="${GITHUB_REF_NAME:-local}"
          safe_ref="$(printf '%s' "$ref_name" | sed -E 's/[^A-Za-z0-9._-]+/-/g; s/^-+//; s/-+$//')"
          if [ -z "$safe_ref" ]; then
            safe_ref="local"
          fi
          runner_arch="$(python -c "import platform; m=platform.machine().lower(); print('x64' if m in ('amd64','x86_64','x64') else 'arm64' if m in ('arm64','aarch64') else (m or 'unknown'))")"
          archive_name="bilikara-${safe_ref}-${{ matrix.slug }}-${runner_arch}.zip"
          artifact_name="bilikara-${safe_ref}-${{ matrix.slug }}-${runner_arch}"
          echo "archive_name=$archive_name" >> "$GITHUB_OUTPUT"
          echo "artifact_name=$artifact_name" >> "$GITHUB_OUTPUT"
          echo "BUNDLE_ARCHIVE=$archive_name" >> "$GITHUB_ENV"

      - name: Stage and verify macOS bundles
        if: runner.os == 'macOS'
        run: |
          mkdir -p dist_release
          ditto dist/bilikara.app dist_release/bilikara.app
          ditto dist/Bilikara-Desktop.app dist_release/Bilikara-Desktop.app
          cp README-macOS.txt dist_release/README-macOS.txt
          test -s dist_release/README-macOS.txt
          python -c 'import pathlib; text = pathlib.Path("dist_release/README-macOS.txt").read_text(encoding="utf-8"); assert all(value in text for value in ("Bilikara-Desktop.app", "bilikara.app", "隐私与安全性", "仍要打开"))'

          echo "=== Verifying staged bilikara.app ==="
          test -x dist_release/bilikara.app/Contents/MacOS/bilikara
          plutil -lint dist_release/bilikara.app/Contents/Info.plist
          codesign --verify --deep --strict --verbose=4 dist_release/bilikara.app
          codesign -dv --verbose=4 dist_release/bilikara.app

          echo "=== Verifying staged Bilikara-Desktop.app ==="
          test -x dist_release/Bilikara-Desktop.app/Contents/MacOS/bilikara
          embedded_backend="dist_release/Bilikara-Desktop.app/Contents/Frameworks/bilikara-backend.app"
          test -x "$embedded_backend/Contents/MacOS/bilikara"
          plutil -lint dist_release/Bilikara-Desktop.app/Contents/Info.plist
          plutil -lint "$embedded_backend/Contents/Info.plist"
          codesign --verify --deep --strict --verbose=4 "$embedded_backend"
          codesign --verify --deep --strict --verbose=4 dist_release/Bilikara-Desktop.app
          codesign -dv --verbose=4 dist_release/Bilikara-Desktop.app

          echo "=== Architecture checks ==="
          file dist_release/bilikara.app/Contents/MacOS/bilikara
          file dist_release/Bilikara-Desktop.app/Contents/MacOS/bilikara
          file "$embedded_backend/Contents/MacOS/bilikara"
          test "$(lipo -archs dist_release/Bilikara-Desktop.app/Contents/MacOS/bilikara)" = "$(lipo -archs "$embedded_backend/Contents/MacOS/bilikara")"

          echo "=== Locked aria2c metadata-only checks ==="
          aria2_metadata="$embedded_backend/Contents/Resources/vendor/aria2-macos.json"
          test -f "$aria2_metadata"
          expected_arch="$(python -c "import platform; m=platform.machine().lower(); print('x64' if m in ('amd64','x86_64','x64') else 'arm64')")"
          python -c 'import json,sys; data=json.load(open(sys.argv[1], encoding="utf-8")); assert data["schema_version"] == 2; assert data["arch"] == sys.argv[2]; assert data["url"].startswith("https://"); assert len(data["sha256"]) == 64; print("locked aria2c metadata: arch={} sha256={}".format(data["arch"], data["sha256"]))' "$aria2_metadata" "$expected_arch"
          unexpected_aria2="$(find dist_release -type f \( -name aria2c -o -name aria2c.exe \) -print)"
          if [ -n "$unexpected_aria2" ]; then
            echo "Unexpected bundled aria2c executable candidate(s):" >&2
            printf '%s\n' "$unexpected_aria2" >&2
            exit 1
          fi

          echo "=== Packaged portable FFmpeg checks ==="
          for binary_name in ffmpeg ffprobe; do
            packaged_tool="dist_release/bilikara.app/Contents/Frameworks/vendor/$binary_name"
            test -x "$packaged_tool"
            "$packaged_tool" -version
            /usr/bin/otool -L "$packaged_tool"
          done

          echo "=== Running Python backend smoke test ==="
          BILIKARA_REQUIRE_BACKEND_SMOKE=1 BILIKARA_TEST_BACKEND_EXE="$(pwd)/dist_release/bilikara.app/Contents/MacOS/bilikara" python -m unittest tests.test_macos_backend_smoke.MacOSBackendSmokeTest -v

          echo "=== Running Tauri/backend shell and Finder-like environment smoke tests ==="
          BILIKARA_TAURI_SMOKE_TIMEOUT_SECONDS=120 BILIKARA_REQUIRE_TAURI_SMOKE=1 BILIKARA_TEST_TAURI_EXE="$(pwd)/dist_release/Bilikara-Desktop.app/Contents/MacOS/bilikara" python -m unittest tests.test_macos_tauri_smoke.MacOSTauriSmokeTest -v

      - name: Archive Windows bundle
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path dist/bilikara -DestinationPath $env:BUNDLE_ARCHIVE

      - name: Archive and verify round-trip macOS bundle
        if: runner.os == 'macOS'
        run: |
          ditto -c -k --sequesterRsrc --keepParent dist_release "$BUNDLE_ARCHIVE"

          mkdir -p test_extract
          ditto -x -k "$BUNDLE_ARCHIVE" test_extract/
          test -s test_extract/dist_release/README-macOS.txt
          cmp README-macOS.txt test_extract/dist_release/README-macOS.txt

          echo "=== Verifying extracted bilikara.app ==="
          test -x test_extract/dist_release/bilikara.app/Contents/MacOS/bilikara
          plutil -lint test_extract/dist_release/bilikara.app/Contents/Info.plist
          codesign --verify --deep --strict --verbose=4 test_extract/dist_release/bilikara.app
          codesign -dv --verbose=4 test_extract/dist_release/bilikara.app

          echo "=== Verifying extracted Bilikara-Desktop.app ==="
          test -x test_extract/dist_release/Bilikara-Desktop.app/Contents/MacOS/bilikara
          extracted_embedded_backend="test_extract/dist_release/Bilikara-Desktop.app/Contents/Frameworks/bilikara-backend.app"
          test -x "$extracted_embedded_backend/Contents/MacOS/bilikara"
          plutil -lint test_extract/dist_release/Bilikara-Desktop.app/Contents/Info.plist
          plutil -lint "$extracted_embedded_backend/Contents/Info.plist"
          codesign --verify --deep --strict --verbose=4 "$extracted_embedded_backend"
          codesign --verify --deep --strict --verbose=4 test_extract/dist_release/Bilikara-Desktop.app
          codesign -dv --verbose=4 test_extract/dist_release/Bilikara-Desktop.app
          test "$(lipo -archs test_extract/dist_release/Bilikara-Desktop.app/Contents/MacOS/bilikara)" = "$(lipo -archs "$extracted_embedded_backend/Contents/MacOS/bilikara")"
          extracted_aria2_metadata="$extracted_embedded_backend/Contents/Resources/vendor/aria2-macos.json"
          test -f "$extracted_aria2_metadata"
          python -c 'import json,sys; data=json.load(open(sys.argv[1], encoding="utf-8")); assert data["schema_version"] == 2; assert data["arch"] == sys.argv[2]; assert data["url"].startswith("https://"); assert len(data["sha256"]) == 64' "$extracted_aria2_metadata" "$(python -c "import platform; m=platform.machine().lower(); print('x64' if m in ('amd64','x86_64','x64') else 'arm64')")"
          unexpected_aria2="$(find test_extract/dist_release -type f \( -name aria2c -o -name aria2c.exe \) -print)"
          if [ -n "$unexpected_aria2" ]; then
            echo "Unexpected archived aria2c executable candidate(s):" >&2
            printf '%s\n' "$unexpected_aria2" >&2
            exit 1
          fi

          echo "=== Running extracted portable FFmpeg checks ==="
          for binary_name in ffmpeg ffprobe; do
            packaged_tool="test_extract/dist_release/bilikara.app/Contents/Frameworks/vendor/$binary_name"
            test -x "$packaged_tool"
            "$packaged_tool" -version
            /usr/bin/otool -L "$packaged_tool"
          done

          echo "=== Running round-trip extracted shell and Finder-like smoke tests ==="
          BILIKARA_REQUIRE_BACKEND_SMOKE=1 BILIKARA_TEST_BACKEND_EXE="$(pwd)/test_extract/dist_release/bilikara.app/Contents/MacOS/bilikara" python -m unittest tests.test_macos_backend_smoke.MacOSBackendSmokeTest -v
          BILIKARA_TAURI_SMOKE_TIMEOUT_SECONDS=120 BILIKARA_REQUIRE_TAURI_SMOKE=1 BILIKARA_TEST_TAURI_EXE="$(pwd)/test_extract/dist_release/Bilikara-Desktop.app/Contents/MacOS/bilikara" python -m unittest tests.test_macos_tauri_smoke.MacOSTauriSmokeTest -v

      - name: Upload Windows bundle artifact
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v6
        with:
          name: ${{ steps.bundle-name.outputs.artifact_name }}
          path: dist/bilikara
          if-no-files-found: error

      - name: Upload macOS bundle artifact
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v6
        with:
          name: ${{ steps.bundle-name.outputs.artifact_name }}
          path: ${{ steps.bundle-name.outputs.archive_name }}
          if-no-files-found: error

      - name: Upload bundle to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          files: ${{ steps.bundle-name.outputs.archive_name }}
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-preview.') }}

  mirror-release-r2:
    name: Mirror Release To R2
    needs: bundle
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    env:
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: auto
      R2_BUCKET: ${{ vars.R2_BUCKET || 'bilikara-releases' }}
      RELEASE_DOWNLOAD_BASE_URL: ${{ vars.RELEASE_DOWNLOAD_BASE_URL || 'https://api.kevinx96.icu/bilikara/releases/download' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install AWS CLI
        run: python -m pip install --upgrade awscli

      - name: Download GitHub Release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p release-assets release-metadata
          gh release download "$GITHUB_REF_NAME" --dir release-assets --clobber
          gh api -H "Accept: application/vnd.github+json" \
            "/repos/${GITHUB_REPOSITORY}/releases/tags/${GITHUB_REF_NAME}" \
            > release-metadata/current-github.json
          gh api -H "Accept: application/vnd.github+json" \
            "/repos/${GITHUB_REPOSITORY}/releases?per_page=30" \
            > release-metadata/releases-github.json

      - name: Generate mirrored release metadata
        run: |
          node <<'NODE'
          const fs = require("fs");

          const tag = process.env.GITHUB_REF_NAME;
          const baseUrl = String(process.env.RELEASE_DOWNLOAD_BASE_URL || "").replace(/\/+$/, "");

          function assetUrl(assetName, tagName = tag) {
            return `${baseUrl}/${encodeURIComponent(tagName)}/${encodeURIComponent(assetName)}`;
          }

          function mirrorRelease(release) {
            return {
              ...release,
              assets: Array.isArray(release.assets)
                ? release.assets.map((asset) => ({
                    ...asset,
                    browser_download_url: assetUrl(asset.name, release.tag_name || tag),
                  }))
                : [],
            };
          }

          const current = mirrorRelease(JSON.parse(fs.readFileSync("release-metadata/current-github.json", "utf8")));
          const releases = JSON.parse(fs.readFileSync("release-metadata/releases-github.json", "utf8"))
            .filter((release) => release && typeof release === "object")
            .map(mirrorRelease);

          fs.writeFileSync("release-metadata/tag.json", JSON.stringify(current, null, 2));
          fs.writeFileSync("release-metadata/releases.json", JSON.stringify(releases, null, 2));
          if (!current.prerelease) {
            fs.writeFileSync("release-metadata/latest.json", JSON.stringify(current, null, 2));
          }
          NODE

      - name: Upload release mirror to R2
        run: |
          endpoint="https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com"
          tag="${GITHUB_REF_NAME}"
          aws s3 cp release-assets "s3://${R2_BUCKET}/bilikara/releases/download/${tag}/" \
            --recursive \
            --endpoint-url "$endpoint" \
            --cache-control "public, max-age=31536000, immutable" \
            --only-show-errors
          aws s3 cp release-metadata/tag.json "s3://${R2_BUCKET}/bilikara/releases/tags/${tag}.json" \
            --endpoint-url "$endpoint" \
            --content-type "application/json; charset=utf-8" \
            --cache-control "public, max-age=300" \
            --only-show-errors
          if [ -f release-metadata/latest.json ]; then
            aws s3 cp release-metadata/latest.json "s3://${R2_BUCKET}/bilikara/releases/latest.json" \
              --endpoint-url "$endpoint" \
              --content-type "application/json; charset=utf-8" \
              --cache-control "public, max-age=300" \
              --only-show-errors
          fi

name: CI And Bundles

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'images/**'
      - 'LICENSE'
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:
    inputs:
      bundle_version:
        description: 'Optional desktop bundle version, e.g. v0.8.0-preview.3. Builds artifacts only; releases and mirrors still require a tag.'
        type: string
        default: ''
      ios_adhoc:
        description: 'Also sign an iOS Ad Hoc test IPA. Requires Apple Distribution P12 and a matching registered-device profile in iOS secrets.'
        type: boolean
        default: false

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  desktop:
    name: Desktop
    uses: ./.github/workflows/desktop.yml
    with:
      bundle_version: ${{ inputs.bundle_version || '' }}

  mobile:
    name: Mobile
    uses: ./.github/workflows/mobile.yml
    with:
      ios_adhoc: ${{ github.event_name == 'workflow_dispatch' && inputs.ios_adhoc || false }}
    secrets:
      IOS_CERTIFICATE: ${{ github.event_name == 'workflow_dispatch' && inputs.ios_adhoc && secrets.IOS_CERTIFICATE || '' }}
      IOS_CERTIFICATE_PASSWORD: ${{ github.event_name == 'workflow_dispatch' && inputs.ios_adhoc && secrets.IOS_CERTIFICATE_PASSWORD || '' }}
      IOS_MOBILE_PROVISION: ${{ github.event_name == 'workflow_dispatch' && inputs.ios_adhoc && secrets.IOS_MOBILE_PROVISION || '' }}
      ANDROID_BETA_KEYSTORE_BASE64: ${{ github.event_name == 'workflow_dispatch' && !startsWith(github.ref, 'refs/tags/') && secrets.ANDROID_BETA_KEYSTORE_BASE64 || '' }}
      ANDROID_KEYSTORE_BASE64: ${{ startsWith(github.ref, 'refs/tags/v') && secrets.ANDROID_KEYSTORE_BASE64 || '' }}
      ANDROID_KEYSTORE_PASSWORD: ${{ startsWith(github.ref, 'refs/tags/v') && secrets.ANDROID_KEYSTORE_PASSWORD || '' }}
      ANDROID_KEY_ALIAS: ${{ startsWith(github.ref, 'refs/tags/v') && secrets.ANDROID_KEY_ALIAS || '' }}
      ANDROID_KEY_PASSWORD: ${{ startsWith(github.ref, 'refs/tags/v') && secrets.ANDROID_KEY_PASSWORD || '' }}

  mirror-release-r2:
    name: Mirror Release To R2
    needs: [desktop, mobile]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    env:
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: auto
      R2_BUCKET: ${{ vars.R2_BUCKET || 'bilikara-releases' }}
      RELEASE_DOWNLOAD_BASE_URL: ${{ vars.RELEASE_DOWNLOAD_BASE_URL || 'https://api.kevinx96.icu/bilikara/releases/download' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install AWS CLI
        run: python -m pip install --upgrade awscli

      - name: Download GitHub Release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p release-assets release-metadata
          gh release download "$GITHUB_REF_NAME" --dir release-assets --clobber
          # The by-tag REST endpoint excludes drafts. Find the authenticated
          # draft in the release list, then publish after every package passed.
          release_id="$(gh api --paginate "/repos/${GITHUB_REPOSITORY}/releases?per_page=100" \
            | jq -r --arg tag "$GITHUB_REF_NAME" '.[] | select(.tag_name == $tag) | .id')"
          [[ "$release_id" =~ ^[0-9]+$ ]]
          gh api --method PATCH "/repos/${GITHUB_REPOSITORY}/releases/${release_id}" \
            -f tag_name="$GITHUB_REF_NAME" -F draft=false > release-metadata/current-github.json
          gh api -H "Accept: application/vnd.github+json" \
            "/repos/${GITHUB_REPOSITORY}/releases?per_page=30" \
            > release-metadata/releases-github.json

      - name: Generate mirrored release metadata
        run: |
          node <<'NODE'
          const fs = require("fs");

          const tag = process.env.GITHUB_REF_NAME;
          const baseUrl = String(process.env.RELEASE_DOWNLOAD_BASE_URL || "").replace(/\/+$/, "");

          function assetUrl(asset, tagName = tag) {
            const digest = /^sha256:[a-f0-9]{64}$/.test(asset.digest || "")
              ? `?sha256=${asset.digest.slice(7)}` : "";
            return `${baseUrl}/${encodeURIComponent(tagName)}/${encodeURIComponent(asset.name)}${digest}`;
          }

          function mirrorRelease(release) {
            return {
              ...release,
              assets: Array.isArray(release.assets)
                ? release.assets.map((asset) => ({
                    ...asset,
                    browser_download_url: assetUrl(asset, release.tag_name || tag),
                  }))
                : [],
            };
          }

          const current = mirrorRelease(JSON.parse(fs.readFileSync("release-metadata/current-github.json", "utf8")));
          const releases = JSON.parse(fs.readFileSync("release-metadata/releases-github.json", "utf8"))
            .filter((release) => release && typeof release === "object" && !release.draft)
            .map(mirrorRelease);

          fs.writeFileSync("release-metadata/tag.json", JSON.stringify(current, null, 2));
          fs.writeFileSync("release-metadata/releases.json", JSON.stringify(releases, null, 2));
          if (!current.prerelease) {
            fs.writeFileSync("release-metadata/latest.json", JSON.stringify(current, null, 2));
          }
          NODE

      - name: Upload release mirror to R2
        run: |
          endpoint="https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com"
          tag="${GITHUB_REF_NAME}"
          aws s3 cp release-assets "s3://${R2_BUCKET}/bilikara/releases/download/${tag}/" \
            --recursive \
            --endpoint-url "$endpoint" \
            --cache-control "public, max-age=0, must-revalidate" \
            --only-show-errors
          aws s3 cp release-metadata/tag.json "s3://${R2_BUCKET}/bilikara/releases/tags/${tag}.json" \
            --endpoint-url "$endpoint" \
            --content-type "application/json; charset=utf-8" \
            --cache-control "public, max-age=300" \
            --only-show-errors
          aws s3 cp release-metadata/releases.json "s3://${R2_BUCKET}/bilikara/releases/releases.json" \
            --endpoint-url "$endpoint" \
            --content-type "application/json; charset=utf-8" \
            --cache-control "public, max-age=300" \
            --only-show-errors
          if [ -f release-metadata/latest.json ]; then
            aws s3 cp release-metadata/latest.json "s3://${R2_BUCKET}/bilikara/releases/latest.json" \
              --endpoint-url "$endpoint" \
              --content-type "application/json; charset=utf-8" \
              --cache-control "public, max-age=300" \
              --only-show-errors
          fi

      - name: Verify uploaded R2 bytes and release metadata
        run: |
          endpoint="https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com"
          mkdir -p r2-verification/assets r2-verification/metadata
          aws s3 cp "s3://${R2_BUCKET}/bilikara/releases/download/${GITHUB_REF_NAME}/" r2-verification/assets \
            --recursive --endpoint-url "$endpoint" --only-show-errors
          aws s3 cp "s3://${R2_BUCKET}/bilikara/releases/tags/${GITHUB_REF_NAME}.json" r2-verification/metadata/tag.json \
            --endpoint-url "$endpoint" --only-show-errors
          aws s3 cp "s3://${R2_BUCKET}/bilikara/releases/releases.json" r2-verification/metadata/releases.json \
            --endpoint-url "$endpoint" --only-show-errors
          node scripts/verify_release_mirror.mjs release-metadata release-assets r2-verification

      - name: Preserve R2 verification receipts
        uses: actions/upload-artifact@v7
        with:
          name: r2-release-verification
          path: r2-verification/verification.json
          if-no-files-found: error

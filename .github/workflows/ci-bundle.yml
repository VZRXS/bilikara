name: CI And Bundles

on:
  push:
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: ["ubuntu-latest", "windows-latest", "macos-latest"]
        python-version:
          - "3.11"

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-packaging.txt

      - name: Install Tauri system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf

      - name: Reset incomplete Rust toolchain on macOS
        if: runner.os == 'macOS'
        run: |
          if rustup toolchain list | grep -q '^1\.97\.0-'; then
            rustup toolchain uninstall 1.97.0
          fi

      - name: Setup repository Rust toolchain
        run: |
          rustup toolchain install
          rustup show active-toolchain
          rustc --version

      - name: Cache Rust builds
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            ./rust -> target
            ./rust-runtime -> target
            ./src-tauri -> target
          shared-key: ci-bundle

      - name: Rust Checks and Build
        shell: bash
        run: |
          set -euo pipefail
          cd rust
          cargo fmt --check
          cargo clippy --all-targets --locked -- -D warnings
          cargo test --locked
          cargo build --release --locked
          cd ../rust-runtime
          cargo fmt --check
          cargo clippy --all-targets --locked -- -D warnings
          cargo test --locked
          cargo build --release --locked
          cd ../src-tauri
          cargo fmt --check
          cargo clippy --all-targets --locked -- -D warnings
          cargo test --locked
          cargo build --release --locked
          cd ..

      - name: Compile Python files
        run: |
          python -m compileall -q bilikara
          python -m py_compile start_bilikara.py build_bundle.py

      - name: Run unit tests
        # Independent QR decoding belongs to tests, not packaged runtime imports.
        # The bundle job continues to install only requirements-packaging.txt.
        run: |
          python -m pip install -r requirements-test-qr.txt
          python -m unittest discover -s tests -v
        env:
          BILIKARA_REQUIRE_RUST_LIB: "1"
          BILIKARA_RUST_STRICT_EQUIVALENCE: "1"

  bundle:
    name: Bundle (${{ matrix.label }})
    needs: test
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include: [{"os": "windows-latest", "label": "Windows x64", "slug": "windows", "arch": "x64"}, {"os": "windows-11-arm", "label": "Windows ARM64", "slug": "windows", "arch": "arm64"}, {"os": "macos-latest", "label": "macOS ARM64", "slug": "macos", "arch": "arm64"}, {"os": "macos-15-intel", "label": "macOS Intel", "slug": "macos", "arch": "x64"}]


    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Resolve bundle archive name
        id: bundle-name
        shell: bash
        env:
          BUNDLE_SLUG: ${{ matrix.slug }}
          BUNDLE_ARCH: ${{ matrix.arch }}
        run: |
          ref_name="${GITHUB_REF_NAME:-local}"
          safe_ref="$(printf '%s' "$ref_name" | sed -E 's/[^A-Za-z0-9._-]+/-/g; s/^-+//; s/-+$//')"
          if [ -z "$safe_ref" ]; then
            safe_ref="local"
          fi
          if [ "${GITHUB_REF_TYPE:-branch}" = "tag" ]; then
            artifact_name="bilikara-${safe_ref}-${BUNDLE_SLUG}-${BUNDLE_ARCH}"
          else
            artifact_name="bilikara-${BUNDLE_SLUG}-${BUNDLE_ARCH}-${safe_ref}"
          fi
          archive_name="${artifact_name}.zip"
          echo "archive_name=$archive_name" >> "$GITHUB_OUTPUT"
          echo "artifact_name=$artifact_name" >> "$GITHUB_OUTPUT"
          echo "BUNDLE_ARCHIVE=$archive_name" >> "$GITHUB_ENV"

      - name: Select native libav build prefix
        shell: bash
        run: |
          echo "BILIKARA_LIBAV_PREFIX=$RUNNER_TEMP/bilikara-libav" >> "$GITHUB_ENV"
          echo "BILIKARA_LIBAV_CACHE=$RUNNER_TEMP/bilikara-libav-cache" >> "$GITHUB_ENV"

      - name: Install macOS source verification tools
        if: runner.os == 'macOS'
        run: brew list gnupg >/dev/null 2>&1 || brew install gnupg

      - name: Prepare pinned BBDown vendor
        shell: bash
        run: |
          bbdown_dir="$RUNNER_TEMP/bilikara-bbdown-vendor"
          python scripts/prepare_bbdown_vendor.py "$bbdown_dir"
          printf '%s\n' "$bbdown_dir/bin" >> "$GITHUB_PATH"
          cat "$bbdown_dir/metadata.env" >> "$GITHUB_ENV"

      - name: Install packaging dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-packaging.txt

      - name: Reset incomplete Rust toolchain on macOS
        if: runner.os == 'macOS'
        run: |
          if rustup toolchain list | grep -q '^1\.97\.0-'; then
            rustup toolchain uninstall 1.97.0
          fi

      - name: Setup repository Rust toolchain
        run: |
          rustup toolchain install
          rustup show active-toolchain
          rustc --version

      - name: Cache Rust builds
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            ./rust -> target
            ./rust-runtime -> target
            ./src-tauri -> target
          shared-key: ci-bundle

      - name: Setup native MSVC environment
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/setup_msvc.ps1 -Arch '${{ matrix.arch }}'

      - name: Resolve libav cache identity
        id: libav-cache-key
        shell: bash
        run: python scripts/libav_cache.py key >> "$GITHUB_OUTPUT"

      - name: Restore verified libav libraries
        id: libav-cache
        uses: actions/cache/restore@v5
        with:
          path: ${{ env.BILIKARA_LIBAV_CACHE }}
          key: ${{ steps.libav-cache-key.outputs.key }}

      - name: Select libav cache result
        shell: bash
        run: echo "BILIKARA_LIBAV_CACHE_HIT=${{ steps.libav-cache.outputs.cache-hit }}" >> "$GITHUB_ENV"

      - name: Setup MSVC build shell
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@v2
        with:
          msystem: MSYS
          path-type: inherit
          install: make diffutils pkgconf perl nasm curl gnupg

      - name: Build Windows libav libraries and companion
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: bash media-libav/build-windows.sh

      - name: Prepare native driver and PE dependencies
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./media-libav/prepare-windows.ps1

      - name: Build POSIX libav libraries and companion
        if: runner.os == 'macOS'
        run: bash media-libav/build-posix.sh

      - name: Save verified libav libraries
        if: steps.libav-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: ${{ env.BILIKARA_LIBAV_CACHE }}
          key: ${{ steps.libav-cache-key.outputs.key }}

      - name: Build app bundle
        run: python build_bundle.py
        env:
          BILIKARA_REQUIRE_RUST_LIB: "1"

      - name: Verify native backend and bundled tools on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $files = Get-ChildItem -Path dist/bilikara -Recurse -File
          foreach ($library in @('bilikara-desktop-host.exe', 'native-desktop.json')) {
            if (-not ($files | Where-Object Name -eq $library)) {
              throw "Packaged Rust library was not found: $library"
            }
          }
          foreach ($tool in @('BBDown.exe')) {
            $vendor = $files | Where-Object { $_.Name -eq $tool -and $_.FullName -match '[\\/]vendor[\\/]' } | Select-Object -First 1
            if (-not $vendor) {
              throw "Packaged vendor tool was not found: $tool"
            }
            if ($tool -eq 'BBDown.exe') {
              & $vendor.FullName --help
            } else {
              & $vendor.FullName -version
            }
            if ($LASTEXITCODE -ne 0) {
              throw "Packaged vendor tool execution failed: $tool"
            }
          }

      - name: Verify native backend and bundled tools on macOS
        if: runner.os == 'macOS'
        run: |
          test -x dist/bilikara.app/Contents/MacOS/bilikara-desktop-host
          test -f dist/bilikara.app/Contents/Resources/native-desktop.json
          bbdown_vendor="$(find dist/bilikara.app -type f -name BBDown -path '*/vendor/*' -print -quit)"
          test -n "$bbdown_vendor"
          "$bbdown_vendor" --help

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Build Tauri App on Windows
        if: runner.os == 'Windows'
        run: |
          npm ci
          npm exec -- tauri icon static/pic/icon.png
          npm exec -- tauri build --no-bundle -- --locked

      - name: Build Tauri App on macOS
        if: runner.os == 'macOS'
        run: |
          npm ci
          npm exec -- tauri icon static/pic/icon.png
          npm exec -- tauri build --bundles app -- --locked

      - name: Inject Tauri into Windows Bundle
        if: runner.os == 'Windows'
        shell: pwsh
        run: Copy-Item src-tauri/target/release/bilikara.exe -Destination dist/bilikara/bilikara-desktop.exe


      - name: Inject Tauri into macOS Bundle
        if: runner.os == 'macOS'
        run: ditto src-tauri/target/release/bundle/macos/bilikara.app dist/Bilikara-Desktop.app

      - name: Embed signed backend in macOS Desktop bundle
        if: runner.os == 'macOS'
        run: python scripts/embed_macos_backend.py dist/bilikara.app dist/Bilikara-Desktop.app

      - name: Stage and verify macOS bundles
        if: runner.os == 'macOS'
        run: |
          mkdir -p dist_release
          ditto dist/Bilikara-Desktop.app dist_release/Bilikara-Desktop.app
          ln -s Bilikara-Desktop.app/Contents/Frameworks/bilikara-backend.app dist_release/bilikara.app
          test "$(readlink dist_release/bilikara.app)" = Bilikara-Desktop.app/Contents/Frameworks/bilikara-backend.app
          cp README-macOS.txt dist_release/README-macOS.txt
          test -s dist_release/README-macOS.txt
          python -c 'import pathlib; text = pathlib.Path("dist_release/README-macOS.txt").read_text(encoding="utf-8"); assert all(value in text for value in ("Bilikara-Desktop.app", "bilikara.app", "隐私与安全性", "仍要打开"))'

          echo "=== Verifying staged bilikara.app ==="
          test -x dist_release/bilikara.app/Contents/MacOS/bilikara-desktop-host
          plutil -lint dist_release/bilikara.app/Contents/Info.plist
          codesign --verify --deep --strict --verbose=4 dist_release/bilikara.app
          codesign -dv --verbose=4 dist_release/bilikara.app

          echo "=== Verifying staged Bilikara-Desktop.app ==="
          test -x dist_release/Bilikara-Desktop.app/Contents/MacOS/bilikara
          embedded_backend="dist_release/Bilikara-Desktop.app/Contents/Frameworks/bilikara-backend.app"
          test -x "$embedded_backend/Contents/MacOS/bilikara-desktop-host"
          plutil -lint dist_release/Bilikara-Desktop.app/Contents/Info.plist
          plutil -lint "$embedded_backend/Contents/Info.plist"
          codesign --verify --deep --strict --verbose=4 "$embedded_backend"
          codesign --verify --deep --strict --verbose=4 dist_release/Bilikara-Desktop.app
          codesign -dv --verbose=4 dist_release/Bilikara-Desktop.app

          echo "=== Architecture checks ==="
          file dist_release/bilikara.app/Contents/MacOS/bilikara-desktop-host
          file dist_release/Bilikara-Desktop.app/Contents/MacOS/bilikara
          file "$embedded_backend/Contents/MacOS/bilikara-desktop-host"
          test "$(lipo -archs dist_release/Bilikara-Desktop.app/Contents/MacOS/bilikara)" = "$(lipo -archs "$embedded_backend/Contents/MacOS/bilikara-desktop-host")"

          echo "=== Locked aria2c metadata-only checks ==="
          aria2_metadata="$embedded_backend/Contents/Resources/vendor/aria2-macos.json"
          test -f "$aria2_metadata"
          expected_arch="$(python -c "import platform; m=platform.machine().lower(); print('x64' if m in ('amd64','x86_64','x64') else 'arm64')")"
          python -c 'import json,sys; data=json.load(open(sys.argv[1], encoding="utf-8")); assert data["schema_version"] == 2; assert data["arch"] == sys.argv[2]; assert data["url"].startswith("https://"); assert len(data["sha256"]) == 64; print("locked aria2c metadata: arch={} sha256={}".format(data["arch"], data["sha256"]))' "$aria2_metadata" "$expected_arch"
          unexpected_aria2="$(find dist_release -type f \( -name aria2c -o -name aria2c.exe \) -print)"
          if [ -n "$unexpected_aria2" ]; then
            echo "Unexpected bundled aria2c executable candidate(s):" >&2
            printf '%s\n' "$unexpected_aria2" >&2
            exit 1
          fi


      - name: Archive Windows bundle
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path dist/bilikara -DestinationPath $env:BUNDLE_ARCHIVE

      - name: Verify extracted Windows bundle
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $extracted = Join-Path $env:RUNNER_TEMP 'Bilikara preview 空'
          Expand-Archive -Path $env:BUNDLE_ARCHIVE -DestinationPath $extracted
          $package = Join-Path $extracted 'bilikara'
          foreach ($required in @('bilikara-desktop-host.exe', 'bilikara-desktop.exe', 'vendor/bilikara_media_libav.dll', 'native-desktop.json')) {
            if (-not (Test-Path (Join-Path $package $required))) {
              throw "Extracted bundle is missing $required"
            }
          }
          foreach ($buildOnly in @('preview', 'libav-smoke.ps1', 'libav-smoke-result.json', 'vendor/bilikara_media_libav_test.dll')) {
            if (Test-Path (Join-Path $package $buildOnly)) {
              throw "Build-only validation payload leaked into archive: $buildOnly"
            }
          }

      - name: Archive and verify round-trip macOS bundle
        if: runner.os == 'macOS'
        run: |
          ditto -c -k --sequesterRsrc --keepParent dist_release "$BUNDLE_ARCHIVE"

          mkdir -p test_extract
          ditto -x -k "$BUNDLE_ARCHIVE" test_extract/
          test -s test_extract/dist_release/README-macOS.txt
          test -L test_extract/dist_release/bilikara.app
          test "$(readlink test_extract/dist_release/bilikara.app)" = Bilikara-Desktop.app/Contents/Frameworks/bilikara-backend.app
          cmp README-macOS.txt test_extract/dist_release/README-macOS.txt
          test ! -e test_extract/dist_release/bilikara.app/Contents/Resources/libav-diagnostics
          test ! -e test_extract/dist_release/bilikara.app/Contents/Frameworks/vendor/libbilikara_media_libav_test.dylib
          test ! -e test_extract/dist_release/Bilikara-Desktop.app/Contents/Frameworks/bilikara-backend.app/Contents/Resources/libav-diagnostics
          test ! -e test_extract/dist_release/Bilikara-Desktop.app/Contents/Frameworks/bilikara-backend.app/Contents/Frameworks/vendor/libbilikara_media_libav_test.dylib

          echo "=== Verifying extracted bilikara.app ==="
          test -x test_extract/dist_release/bilikara.app/Contents/MacOS/bilikara-desktop-host
          plutil -lint test_extract/dist_release/bilikara.app/Contents/Info.plist
          codesign --verify --deep --strict --verbose=4 test_extract/dist_release/bilikara.app
          codesign -dv --verbose=4 test_extract/dist_release/bilikara.app

          echo "=== Verifying extracted Bilikara-Desktop.app ==="
          test -x test_extract/dist_release/Bilikara-Desktop.app/Contents/MacOS/bilikara
          extracted_embedded_backend="test_extract/dist_release/Bilikara-Desktop.app/Contents/Frameworks/bilikara-backend.app"
          test -x "$extracted_embedded_backend/Contents/MacOS/bilikara-desktop-host"
          plutil -lint test_extract/dist_release/Bilikara-Desktop.app/Contents/Info.plist
          plutil -lint "$extracted_embedded_backend/Contents/Info.plist"
          codesign --verify --deep --strict --verbose=4 "$extracted_embedded_backend"
          codesign --verify --deep --strict --verbose=4 test_extract/dist_release/Bilikara-Desktop.app
          codesign -dv --verbose=4 test_extract/dist_release/Bilikara-Desktop.app
          test "$(lipo -archs test_extract/dist_release/Bilikara-Desktop.app/Contents/MacOS/bilikara)" = "$(lipo -archs "$extracted_embedded_backend/Contents/MacOS/bilikara-desktop-host")"

          extracted_aria2_metadata="$extracted_embedded_backend/Contents/Resources/vendor/aria2-macos.json"
          test -f "$extracted_aria2_metadata"
          python -c 'import json,sys; data=json.load(open(sys.argv[1], encoding="utf-8")); assert data["schema_version"] == 2; assert data["arch"] == sys.argv[2]; assert data["url"].startswith("https://"); assert len(data["sha256"]) == 64' "$extracted_aria2_metadata" "$(python -c "import platform; m=platform.machine().lower(); print('x64' if m in ('amd64','x86_64','x64') else 'arm64')")"
          unexpected_aria2="$(find test_extract/dist_release -type f \( -name aria2c -o -name aria2c.exe \) -print)"
          if [ -n "$unexpected_aria2" ]; then
            echo "Unexpected archived aria2c executable candidate(s):" >&2
            printf '%s\n' "$unexpected_aria2" >&2
            exit 1
          fi


      - name: Verify extracted native desktop and no-media-CLI layout on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $backend = Join-Path $env:RUNNER_TEMP 'Bilikara preview 空/bilikara/bilikara-desktop-host.exe'
          python scripts/check_native_desktop_bundle.py "$backend"

      - name: Verify extracted native desktop and no-media-CLI layout on macOS
        if: runner.os == 'macOS'
        run: |
          python scripts/check_native_desktop_bundle.py test_extract/dist_release/bilikara.app/Contents/MacOS/bilikara-desktop-host
          python scripts/check_native_desktop_bundle.py test_extract/dist_release/Bilikara-Desktop.app/Contents/Frameworks/bilikara-backend.app/Contents/MacOS/bilikara-desktop-host

      - name: Upload native bundle
        uses: actions/upload-artifact@v7
        with:
          path: ${{ steps.bundle-name.outputs.archive_name }}
          archive: false
          if-no-files-found: error

      - name: Upload bundle to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          files: ${{ steps.bundle-name.outputs.archive_name }}
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-preview.') }}

  android-bundle:
    name: Android ARM64 APK
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          # The action's default also requests the unavailable legacy "tools" package.
          packages: platform-tools

      - name: Install pinned Android tools
        run: |
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "ndk;27.0.12077973"
          echo "NDK_HOME=$ANDROID_HOME/ndk/27.0.12077973" >> "$GITHUB_ENV"

      - name: Setup repository Rust toolchain
        run: |
          rustup toolchain install
          rustup target add aarch64-linux-android

      - name: Cache Rust builds
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            ./rust-runtime -> target
            ./src-tauri -> target
          shared-key: android-apk

      - name: Cache Gradle dependencies
        uses: gradle/actions/setup-gradle@v5
        with:
          add-job-summary: never
          cache-read-only: ${{ github.event_name == 'pull_request' }}

      - name: Resolve APK and require signing for tags
        id: android
        env:
          ANDROID_KEYSTORE_BASE64: ${{ startsWith(github.ref, 'refs/tags/v') && secrets.ANDROID_KEYSTORE_BASE64 || '' }}
          ANDROID_KEYSTORE_PASSWORD: ${{ startsWith(github.ref, 'refs/tags/v') && secrets.ANDROID_KEYSTORE_PASSWORD || '' }}
          ANDROID_KEY_ALIAS: ${{ startsWith(github.ref, 'refs/tags/v') && secrets.ANDROID_KEY_ALIAS || '' }}
          ANDROID_KEY_PASSWORD: ${{ startsWith(github.ref, 'refs/tags/v') && secrets.ANDROID_KEY_PASSWORD || '' }}
        run: node scripts/android_release.mjs

      - name: Validate native Host and Android packaging contract
        run: |
          cargo test --manifest-path rust-runtime/Cargo.toml --features native-host --locked
          node --test tests/android_release.test.mjs
          npm ci

      - name: Build APK
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ startsWith(github.ref, 'refs/tags/v') && secrets.ANDROID_KEYSTORE_PASSWORD || '' }}
          ANDROID_KEY_ALIAS: ${{ startsWith(github.ref, 'refs/tags/v') && secrets.ANDROID_KEY_ALIAS || '' }}
          ANDROID_KEY_PASSWORD: ${{ startsWith(github.ref, 'refs/tags/v') && secrets.ANDROID_KEY_PASSWORD || '' }}
          RELEASE_APK: ${{ steps.android.outputs.release }}
        run: |
          chmod +x src-tauri/gen/android/gradlew
          if [ "$RELEASE_APK" = "true" ]; then
            npm exec -- tauri android build --apk --target aarch64 --ci
          else
            npm run android:build:debug
          fi

      - name: Stage and verify APK
        env:
          APK_NAME: ${{ steps.android.outputs.apk }}
          RELEASE_APK: ${{ steps.android.outputs.release }}
        run: |
          variant=debug
          if [ "$RELEASE_APK" = "true" ]; then variant=release; fi
          mapfile -t apks < <(find src-tauri/gen/android/app/build/outputs/apk -type f -name "*${variant}.apk")
          test "${#apks[@]}" = 1
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose "${apks[0]}"
          "$ANDROID_HOME/build-tools/36.0.0/zipalign" -c -P 16 -v 4 "${apks[0]}"
          cp "${apks[0]}" "$APK_NAME"

      - name: Upload APK test artifact
        uses: actions/upload-artifact@v7
        with:
          path: ${{ steps.android.outputs.apk }}
          archive: false
          if-no-files-found: error

      - name: Upload signed APK to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          files: ${{ steps.android.outputs.apk }}
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-preview.') }}

      - name: Remove temporary signing file
        if: always()
        run: |
          if [ -n "${ANDROID_KEYSTORE_PATH:-}" ] && [ "$ANDROID_KEYSTORE_PATH" = "$RUNNER_TEMP/bilikara-android-release.jks" ]; then
            rm -f -- "$ANDROID_KEYSTORE_PATH"
          fi

  mirror-release-r2:
    name: Mirror Release To R2
    needs: [bundle, android-bundle]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    env:
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: auto
      R2_BUCKET: ${{ vars.R2_BUCKET || 'bilikara-releases' }}
      RELEASE_DOWNLOAD_BASE_URL: ${{ vars.RELEASE_DOWNLOAD_BASE_URL || 'https://api.kevinx96.icu/bilikara/releases/download' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install AWS CLI
        run: python -m pip install --upgrade awscli

      - name: Download GitHub Release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p release-assets release-metadata
          gh release download "$GITHUB_REF_NAME" --dir release-assets --clobber
          gh api -H "Accept: application/vnd.github+json" \
            "/repos/${GITHUB_REPOSITORY}/releases/tags/${GITHUB_REF_NAME}" \
            > release-metadata/current-github.json
          gh api -H "Accept: application/vnd.github+json" \
            "/repos/${GITHUB_REPOSITORY}/releases?per_page=30" \
            > release-metadata/releases-github.json

      - name: Generate mirrored release metadata
        run: |
          node <<'NODE'
          const fs = require("fs");

          const tag = process.env.GITHUB_REF_NAME;
          const baseUrl = String(process.env.RELEASE_DOWNLOAD_BASE_URL || "").replace(/\/+$/, "");

          function assetUrl(assetName, tagName = tag) {
            return `${baseUrl}/${encodeURIComponent(tagName)}/${encodeURIComponent(assetName)}`;
          }

          function mirrorRelease(release) {
            return {
              ...release,
              assets: Array.isArray(release.assets)
                ? release.assets.map((asset) => ({
                    ...asset,
                    browser_download_url: assetUrl(asset.name, release.tag_name || tag),
                  }))
                : [],
            };
          }

          const current = mirrorRelease(JSON.parse(fs.readFileSync("release-metadata/current-github.json", "utf8")));
          const releases = JSON.parse(fs.readFileSync("release-metadata/releases-github.json", "utf8"))
            .filter((release) => release && typeof release === "object")
            .map(mirrorRelease);

          fs.writeFileSync("release-metadata/tag.json", JSON.stringify(current, null, 2));
          fs.writeFileSync("release-metadata/releases.json", JSON.stringify(releases, null, 2));
          if (!current.prerelease) {
            fs.writeFileSync("release-metadata/latest.json", JSON.stringify(current, null, 2));
          }
          NODE

      - name: Upload release mirror to R2
        run: |
          endpoint="https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com"
          tag="${GITHUB_REF_NAME}"
          aws s3 cp release-assets "s3://${R2_BUCKET}/bilikara/releases/download/${tag}/" \
            --recursive \
            --endpoint-url "$endpoint" \
            --cache-control "public, max-age=31536000, immutable" \
            --only-show-errors
          aws s3 cp release-metadata/tag.json "s3://${R2_BUCKET}/bilikara/releases/tags/${tag}.json" \
            --endpoint-url "$endpoint" \
            --content-type "application/json; charset=utf-8" \
            --cache-control "public, max-age=300" \
            --only-show-errors
          aws s3 cp release-metadata/releases.json "s3://${R2_BUCKET}/bilikara/releases/releases.json" \
            --endpoint-url "$endpoint" \
            --content-type "application/json; charset=utf-8" \
            --cache-control "public, max-age=300" \
            --only-show-errors
          if [ -f release-metadata/latest.json ]; then
            aws s3 cp release-metadata/latest.json "s3://${R2_BUCKET}/bilikara/releases/latest.json" \
              --endpoint-url "$endpoint" \
              --content-type "application/json; charset=utf-8" \
              --cache-control "public, max-age=300" \
              --only-show-errors
          fi

name: Mobile

on:
  workflow_call:
    inputs:
      ios_adhoc:
        type: boolean
        default: false
    secrets:
      IOS_CERTIFICATE:
        required: false
      IOS_CERTIFICATE_PASSWORD:
        required: false
      IOS_MOBILE_PROVISION:
        required: false
      ANDROID_BETA_KEYSTORE_BASE64:
        required: false
      ANDROID_KEYSTORE_BASE64:
        required: false
      ANDROID_KEYSTORE_PASSWORD:
        required: false
      ANDROID_KEY_ALIAS:
        required: false
      ANDROID_KEY_PASSWORD:
        required: false

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  test:
    name: Test (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    env:
      CARGO_PROFILE_DEV_DEBUG: "line-tables-only"
      CARGO_PROFILE_TEST_DEBUG: "line-tables-only"
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: Android
            os: ubuntu-latest
          - platform: iOS
            os: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install locked Node dependencies
        run: npm ci

      - name: Setup Java
        if: matrix.platform == 'Android'
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        if: matrix.platform == 'Android'
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools

      - name: Install pinned Android signing and media tools
        if: matrix.platform == 'Android'
        run: |
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "ndk;27.0.12077973"
          sudo apt-get update
          sudo apt-get install -y make gnupg gpgv ffmpeg

      - name: Setup iOS build tools
        if: matrix.platform == 'iOS'
        id: ios-environment
        uses: ./.github/actions/ios-toolchain

      - name: Setup repository Rust toolchain
        uses: ./.github/actions/rust-toolchain

      - name: Cache Rust test builds
        id: rust-cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            ./rust -> target
            ./rust-runtime -> target
          cache-workspace-crates: true
          shared-key: ${{ matrix.platform == 'Android' && 'android-test-workspace-v1' || 'ios-test-workspace-v1' }}
          key: ${{ steps.ios-environment.outputs.sdk-key }}

      - name: Resolve Android libav C cache
        if: matrix.platform == 'Android'
        id: media-key
        shell: bash
        run: |
          echo "BILIKARA_TEST_ANDROID_NDK=$ANDROID_HOME/ndk/27.0.12077973" >> "$GITHUB_ENV"
          echo "BILIKARA_TEST_ANDROID_LIBAV_CACHE=$RUNNER_TEMP/bilikara-android-libav-cache" >> "$GITHUB_ENV"
          cargo run --manifest-path xtask/Cargo.toml --locked --target host-tuple -- android-libav --ndk "$ANDROID_HOME/ndk/27.0.12077973" --abi arm64-v8a --out "$RUNNER_TEMP/android-media-output" --cache "$RUNNER_TEMP/bilikara-android-libav-cache" --cache-key >> "$GITHUB_OUTPUT"

      - name: Restore Android libav C cache
        if: matrix.platform == 'Android'
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/bilikara-android-libav-cache
          key: ${{ steps.media-key.outputs.key }}

      - name: Verify actual Android media libraries and cache
        if: matrix.platform == 'Android'
        run: npm run test:android-libav

      - name: Validate native Host and mobile UI
        run: |
          cargo fmt --manifest-path rust/Cargo.toml --check
          cargo clippy --manifest-path rust/Cargo.toml --all-targets --locked -- -D warnings
          cargo test --manifest-path rust/Cargo.toml --locked
          cargo fmt --manifest-path rust-runtime/Cargo.toml --check
          cargo clippy --manifest-path rust-runtime/Cargo.toml --features native-host --all-targets --locked -- -D warnings
          cargo test --manifest-path rust-runtime/Cargo.toml --features native-host --locked
          npm run test:frontend

      - name: Validate Android signing contract
        if: matrix.platform == 'Android'
        run: BILIKARA_REQUIRE_ANDROID_SIGNING_TESTS=1 node --test tests/android_release.test.mjs

      - name: Install shared playback browser fixture
        if: matrix.platform == 'Android'
        run: npm exec -- playwright install --with-deps chromium webkit

      - name: Validate shared playback controls and decoded gain
        if: matrix.platform == 'Android'
        # Chromium and Linux WebKit cover real decoded media and timing. They
        # do not qualify native Android/iOS or Apple WKWebView playback.
        env:
          BILIKARA_IOS_PLAYBACK_EVIDENCE: ${{ runner.temp }}/bilikara-shared-playback
        run: npm run test:ios-playback

      - name: Upload shared playback diagnostics
        if: always() && matrix.platform == 'Android'
        uses: actions/upload-artifact@v4
        with:
          name: shared-playback-linux
          path: ${{ runner.temp }}/bilikara-shared-playback
          if-no-files-found: ignore
          retention-days: 7

      - name: Validate iOS startup and build entry
        if: matrix.platform == 'iOS'
        run: |
          npm run test:ios-bootstrap
          npm run test:ios-build
          npm run test:ios-signing

      - name: Summarize Rust test cache
        if: always()
        env:
          CACHE_HIT: ${{ steps.rust-cache.outputs.cache-hit }}
          MOBILE_PLATFORM: ${{ matrix.platform }}
        run: |
          printf '### %s test cache\n\nRust exact hit: `%s` (see restore/save steps for details).\n' "$MOBILE_PLATFORM" "${CACHE_HIT:-unavailable}" >> "$GITHUB_STEP_SUMMARY"

  bundle:
    name: Bundle (${{ matrix.platform }} ${{ matrix.label }})
    needs: test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: Android
            os: ubuntu-latest
            label: ARM64
            rust_target: aarch64-linux-android
            tauri_target: aarch64
          - platform: iOS
            os: macos-15
            label: ARM64 unsigned
            rust_target: aarch64-apple-ios
            tauri_target: aarch64
            export_arch: arm64
            artifact_kind: device-arm64-unsigned
          - platform: iOS
            os: macos-15
            label: Simulator ARM64
            rust_target: aarch64-apple-ios-sim
            tauri_target: aarch64-sim
            export_arch: arm64-sim
            artifact_kind: simulator-arm64
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install locked Node dependencies
        run: npm ci

      - name: Setup Java
        if: matrix.platform == 'Android'
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        if: matrix.platform == 'Android'
        uses: android-actions/setup-android@v4
        with:
          # The action's default also requests the unavailable legacy "tools" package.
          packages: platform-tools

      - name: Prepare native YouTube binding generator
        if: matrix.platform == 'Android'
        run: |
          sudo apt-get update
          sudo apt-get install -y libclang-dev make gnupg gpgv

      - name: Install pinned Android tools
        if: matrix.platform == 'Android'
        run: |
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "ndk;27.0.12077973"
          echo "NDK_HOME=$ANDROID_HOME/ndk/27.0.12077973" >> "$GITHUB_ENV"
          yt_ndk="$ANDROID_HOME/ndk/27.0.12077973/toolchains/llvm/prebuilt/linux-x86_64"
          echo "BINDGEN_EXTRA_CLANG_ARGS_aarch64_linux_android=--target=aarch64-linux-android24 --sysroot=$yt_ndk/sysroot -resource-dir=$yt_ndk/lib/clang/18" >> "$GITHUB_ENV"

      - name: Setup iOS build tools
        if: matrix.platform == 'iOS'
        id: ios-environment
        uses: ./.github/actions/ios-toolchain

      - name: Setup repository Rust toolchain
        uses: ./.github/actions/rust-toolchain

      - name: Install mobile Rust target
        run: rustup target add "${{ matrix.rust_target }}"

      - name: Cache Rust builds
        if: matrix.platform == 'Android'
        id: rust-cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            ./rust -> target
            ./rust-runtime -> target
            ./src-tauri -> target
          cache-workspace-crates: true
          shared-key: android-apk-workspace-v1
          key: android-36-ndk-27.0.12077973

      - name: Cache iOS Rust builds
        if: matrix.platform == 'iOS'
        id: ios-rust-cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            ./rust -> target
            ./rust-runtime -> target
            ./src-tauri -> target
          cache-workspace-crates: true
          shared-key: ios-app-workspace-v1
          key: ${{ matrix.rust_target }}-${{ steps.ios-environment.outputs.sdk-key }}

      - name: Resolve Android libav C cache
        if: matrix.platform == 'Android'
        id: media-key
        shell: bash
        run: |
          echo "BILIKARA_ANDROID_LIBAV_CACHE=$RUNNER_TEMP/bilikara-android-libav-cache" >> "$GITHUB_ENV"
          cargo run --manifest-path xtask/Cargo.toml --locked --target host-tuple -- android-libav --ndk "$ANDROID_HOME/ndk/27.0.12077973" --abi arm64-v8a --out "$RUNNER_TEMP/android-media-output" --cache "$RUNNER_TEMP/bilikara-android-libav-cache" --cache-key >> "$GITHUB_OUTPUT"

      - name: Restore Android libav C cache
        if: matrix.platform == 'Android'
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/bilikara-android-libav-cache
          key: ${{ steps.media-key.outputs.key }}

      - name: Cache Gradle dependencies
        if: matrix.platform == 'Android'
        uses: gradle/actions/setup-gradle@v5
        with:
          add-job-summary: never
          cache-read-only: ${{ github.event_name == 'pull_request' }}

      - name: Resolve APK and prepare signing
        if: matrix.platform == 'Android'
        id: android
        env:
          # Never expose the persistent beta key to pull-request builds or tags.
          ANDROID_BETA_KEYSTORE_BASE64: ${{ github.event_name == 'workflow_dispatch' && !startsWith(github.ref, 'refs/tags/') && secrets.ANDROID_BETA_KEYSTORE_BASE64 || '' }}
          ANDROID_KEYSTORE_BASE64: ${{ startsWith(github.ref, 'refs/tags/v') && secrets.ANDROID_KEYSTORE_BASE64 || '' }}
          ANDROID_KEYSTORE_PASSWORD: ${{ startsWith(github.ref, 'refs/tags/v') && secrets.ANDROID_KEYSTORE_PASSWORD || '' }}
          ANDROID_KEY_ALIAS: ${{ startsWith(github.ref, 'refs/tags/v') && secrets.ANDROID_KEY_ALIAS || '' }}
          ANDROID_KEY_PASSWORD: ${{ startsWith(github.ref, 'refs/tags/v') && secrets.ANDROID_KEY_PASSWORD || '' }}
        run: node scripts/android_release.mjs

      - name: Build APK
        if: matrix.platform == 'Android'
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ startsWith(github.ref, 'refs/tags/v') && secrets.ANDROID_KEYSTORE_PASSWORD || '' }}
          ANDROID_KEY_ALIAS: ${{ startsWith(github.ref, 'refs/tags/v') && secrets.ANDROID_KEY_ALIAS || '' }}
          ANDROID_KEY_PASSWORD: ${{ startsWith(github.ref, 'refs/tags/v') && secrets.ANDROID_KEY_PASSWORD || '' }}
          RELEASE_APK: ${{ steps.android.outputs.release }}
        run: |
          chmod +x src-tauri/gen/android/gradlew
          if [ "$RELEASE_APK" = "true" ]; then
            npm exec -- tauri android build --apk --target "${{ matrix.tauri_target }}" --ci
          else
            npm exec -- tauri android build --debug --apk --target "${{ matrix.tauri_target }}" --ci
          fi

      - name: Compile Android playback service tests
        if: matrix.platform == 'Android'
        working-directory: src-tauri/gen/android
        run: |
          ./gradlew :app:compileArm64DebugAndroidTestKotlin :app:testArm64DebugUnitTest \
            -PabiList=arm64-v8a -x :app:rustBuildArm64Debug --console=plain

      - name: Stage and verify APK
        if: matrix.platform == 'Android'
        env:
          APK_NAME: ${{ steps.android.outputs.apk }}
          RELEASE_APK: ${{ steps.android.outputs.release }}
          APK_SIGNING_MODE: ${{ steps.android.outputs.signing }}
        run: |
          variant=debug
          if [ "$RELEASE_APK" = "true" ]; then variant=release; fi
          mapfile -t apks < <(find src-tauri/gen/android/app/build/outputs/apk -type f -name "*${variant}.apk")
          test "${#apks[@]}" = 1
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs "${apks[0]}" > "$RUNNER_TEMP/android-apk-signature.txt"
          cat "$RUNNER_TEMP/android-apk-signature.txt"
          node scripts/android_release.mjs --verify-signature "$RUNNER_TEMP/android-apk-signature.txt" "$APK_SIGNING_MODE"
          "$ANDROID_HOME/build-tools/36.0.0/zipalign" -c -P 16 -v 4 "${apks[0]}"
          cargo run --manifest-path xtask/Cargo.toml --locked --target host-tuple -- verify-android-apk --ndk "$ANDROID_HOME/ndk/27.0.12077973" --abi "arm64-v8a" --apk "$(realpath "${apks[0]}")"
          cp "${apks[0]}" "$APK_NAME"

      - name: Upload APK test artifact
        if: matrix.platform == 'Android'
        uses: actions/upload-artifact@v7
        with:
          path: ${{ steps.android.outputs.apk }}
          archive: false
          if-no-files-found: error

      - name: Upload signed APK to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') && matrix.platform == 'Android'
        uses: softprops/action-gh-release@v3
        with:
          files: ${{ steps.android.outputs.apk }}
          generate_release_notes: ${{ contains(github.ref_name, '-preview.') }}
          prerelease: ${{ contains(github.ref_name, '-preview.') }}
          draft: true

      - name: Initialize iOS project
        if: matrix.platform == 'iOS'
        run: |
          npm run ios:doctor
          npm run ios:init -- --skip-targets-install

      - name: Build iOS without signing credentials
        if: matrix.platform == 'iOS'
        env:
          IOS_TAURI_TARGET: ${{ matrix.tauri_target }}
        run: node scripts/ios.mjs build --debug --target "$IOS_TAURI_TARGET" --no-sign --ci

      - name: Stage iOS test artifact
        if: matrix.platform == 'iOS'
        env:
          IOS_EXPORT_ARCH: ${{ matrix.export_arch }}
          IOS_ARTIFACT_KIND: ${{ matrix.artifact_kind }}
          IOS_RUST_TARGET: ${{ matrix.rust_target }}
        run: |
          set -euo pipefail
          ios_product_name="$(node -p "require('./src-tauri/tauri.ios.conf.json').productName")"
          ios_product_root="src-tauri/gen/apple/build/$IOS_EXPORT_ARCH"
          ios_stage="$RUNNER_TEMP/bilikara-ios-artifacts"
          mkdir -p "$ios_stage"
          if [ "$IOS_EXPORT_ARCH" = arm64-sim ]; then
            ios_app="$ios_product_root/$ios_product_name.app"
            ios_artifact_name="bilikara-ios-$IOS_ARTIFACT_KIND.app.zip"
            ios_expected_platform=IOSSIMULATOR
            test -d "$ios_app"
          else
            ios_ipa="$ios_product_root/$ios_product_name.ipa"
            ios_artifact_name="bilikara-ios-$IOS_ARTIFACT_KIND.ipa"
            ios_expected_platform=IOS
            test -f "$ios_ipa"
            ditto -x -k "$ios_ipa" "$RUNNER_TEMP/bilikara-ios-unpacked"
            ios_app="$RUNNER_TEMP/bilikara-ios-unpacked/Payload/$ios_product_name.app"
          fi
          plutil -lint "$ios_app/Info.plist"
          test ! -e "$ios_app/embedded.mobileprovision"
          ios_bundle_id="$(node -p "require('./src-tauri/tauri.ios.conf.json').identifier ?? require('./src-tauri/tauri.conf.json').identifier")"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$ios_app/Info.plist")" = "$ios_bundle_id"
          test "$(/usr/libexec/PlistBuddy -c 'Print :NSAppTransportSecurity:NSAllowsArbitraryLoads' "$ios_app/Info.plist")" = false
          ios_executable="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$ios_app/Info.plist")"
          case "$ios_executable" in ''|*/*|.|..) exit 1 ;; esac
          test "$(xcrun lipo -archs "$ios_app/$ios_executable")" = arm64
          xcrun otool -L "$ios_app/$ios_executable" > "$ios_stage/system-frameworks.txt"
          test "$(awk '$1 == "/System/Library/Frameworks/AVFAudio.framework/AVFAudio" {count++} END {print count+0}' "$ios_stage/system-frameworks.txt")" = 1
          xcrun vtool -show-build "$ios_app/$ios_executable" > "$ios_stage/build-platform.txt"
          test "$(awk '$1 == "platform" {print $2}' "$ios_stage/build-platform.txt")" = "$ios_expected_platform"
          if [ "$IOS_EXPORT_ARCH" = arm64-sim ]; then
            ditto -c -k --sequesterRsrc --keepParent "$ios_app" "$ios_stage/$ios_artifact_name"
          else
            cp "$ios_ipa" "$ios_stage/$ios_artifact_name"
          fi
          {
            printf 'commit=%s\nrust_target=%s\nartifact_kind=%s\nsigning=no-provisioning\n' "$GITHUB_SHA" "$IOS_RUST_TARGET" "$IOS_ARTIFACT_KIND"
            cat "$RUNNER_TEMP/bilikara-ios-toolchain.txt"
            rustc --version
            node --version
            xcodegen --version
          } > "$ios_stage/build-info.txt"
          (cd "$ios_stage" && shasum -a 256 "$ios_artifact_name" > SHA256SUMS)

      - name: Upload iOS test artifact
        if: matrix.platform == 'iOS'
        uses: actions/upload-artifact@v7
        with:
          name: bilikara-ios-${{ matrix.artifact_kind }}
          path: ${{ runner.temp }}/bilikara-ios-artifacts/
          if-no-files-found: error

      - name: Summarize iOS build
        if: always() && matrix.platform == 'iOS'
        env:
          CACHE_HIT: ${{ steps.ios-rust-cache.outputs.cache-hit }}
          IOS_ARTIFACT_KIND: ${{ matrix.artifact_kind }}
        run: |
          printf '### iOS %s\n\nRust exact hit: `%s`. No provisioning/signing credentials were used. Device IPA requires valid signing before installation; simulator build is not device acceptance.\n' "$IOS_ARTIFACT_KIND" "${CACHE_HIT:-unavailable}" >> "$GITHUB_STEP_SUMMARY"

      - name: Summarize Rust cache
        if: always() && matrix.platform == 'Android'
        env:
          CACHE_HIT: ${{ steps.rust-cache.outputs.cache-hit }}
        run: |
          printf '### Android bundle cache\n\nRust exact hit: `%s` (see restore/save steps for details).\n' "${CACHE_HIT:-unavailable}" >> "$GITHUB_STEP_SUMMARY"

      - name: Remove temporary signing file
        if: always() && matrix.platform == 'Android'
        run: |
          if [ -n "${ANDROID_KEYSTORE_PATH:-}" ] && [ "$ANDROID_KEYSTORE_PATH" = "$RUNNER_TEMP/bilikara-android-release.jks" ]; then
            rm -f -- "$ANDROID_KEYSTORE_PATH"
          fi
          rm -f -- "$RUNNER_TEMP/bilikara-android-beta.p12"

  ios-adhoc:
    name: Bundle (iOS ARM64 Ad Hoc)
    needs: test
    if: inputs.ios_adhoc && github.event_name == 'workflow_dispatch' && github.repository == 'VZRXS/bilikara' && startsWith(github.ref, 'refs/heads/')
    runs-on: macos-15
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Setup iOS build tools
        id: ios-environment
        uses: ./.github/actions/ios-toolchain

      - name: Check Ad Hoc signing inputs
        env:
          IOS_CERTIFICATE: ${{ secrets.IOS_CERTIFICATE }}
          IOS_CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
          IOS_MOBILE_PROVISION: ${{ secrets.IOS_MOBILE_PROVISION }}
        run: node scripts/ios-signing.mjs preflight "$RUNNER_TEMP/bilikara-ios-signing.json"

      - name: Install locked Node dependencies
        run: npm ci

      - name: Setup repository Rust toolchain
        uses: ./.github/actions/rust-toolchain

      - name: Install iOS device Rust target
        run: rustup target add aarch64-apple-ios

      - name: Cache iOS release Rust builds
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            ./rust -> target
            ./rust-runtime -> target
            ./src-tauri -> target
          cache-workspace-crates: true
          shared-key: ios-adhoc-release-workspace-v1
          key: aarch64-apple-ios-${{ steps.ios-environment.outputs.sdk-key }}

      - name: Initialize iOS project
        run: npm run ios:init -- --skip-targets-install

      - name: Build iOS Ad Hoc
        env:
          IOS_CERTIFICATE: ${{ secrets.IOS_CERTIFICATE }}
          IOS_CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
          IOS_MOBILE_PROVISION: ${{ secrets.IOS_MOBILE_PROVISION }}
        # Pinned Tauri 2.11 uses Xcode's release-testing name for Ad Hoc.
        run: node scripts/ios.mjs build --target aarch64 --export-method release-testing --ci

      - name: Verify and stage signed iOS IPA
        run: |
          ios_product_name="$(node -p "require('./src-tauri/tauri.ios.conf.json').productName")"
          node scripts/ios-signing.mjs verify "src-tauri/gen/apple/build/arm64/$ios_product_name.ipa" \
            "$RUNNER_TEMP/bilikara-ios-signing.json" "$RUNNER_TEMP/bilikara-ios-adhoc-artifact"

      - name: Upload iOS Ad Hoc test artifact
        uses: actions/upload-artifact@v7
        with:
          name: bilikara-ios-device-arm64-adhoc
          path: ${{ runner.temp }}/bilikara-ios-adhoc-artifact/
          retention-days: 7
          if-no-files-found: error

      - name: Remove owned provisioning copy and inspection receipt
        if: always()
        run: node scripts/ios-signing.mjs cleanup "$RUNNER_TEMP/bilikara-ios-signing.json"

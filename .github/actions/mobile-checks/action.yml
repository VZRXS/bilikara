name: Mobile Checks
description: Native mobile checks with shared verified setup
inputs:
  platform:
    description: 'platform'
    required: false
    default: ''
runs:
  using: composite
  steps:
    - name: Setup Node.js
      uses: actions/setup-node@v6
      with:
        node-version: 24
        cache: npm

    - name: Install locked Node dependencies
      shell: ${{ runner.os == 'Windows' && 'pwsh' || 'bash' }}
      run: npm ci

    - name: Setup Java
      if: inputs.platform == 'Android'
      uses: actions/setup-java@v5
      with:
        distribution: temurin
        java-version: 17

    - name: Setup Android SDK
      if: inputs.platform == 'Android'
      uses: android-actions/setup-android@v4
      with:
        packages: platform-tools

    - name: Install pinned Android signing and media tools
      if: inputs.platform == 'Android'
      shell: ${{ runner.os == 'Windows' && 'pwsh' || 'bash' }}
      run: |
        sdkmanager "platforms;android-36" "build-tools;36.0.0" "ndk;27.0.12077973"
        sudo apt-get update
        sudo apt-get install -y make gnupg gpgv

    - name: Prepare Android runner SDK space
      if: inputs.platform == 'Android'
      shell: ${{ runner.os == 'Windows' && 'pwsh' || 'bash' }}
      run: node scripts/ci_sdk_space.mjs android

    - name: Setup iOS build tools
      if: inputs.platform == 'iOS'
      id: ios-environment
      uses: ./.github/actions/ios-toolchain

    - name: Setup repository Rust toolchain
      uses: ./.github/actions/rust-toolchain

    - name: Cache Rust test builds
      id: rust-cache
      uses: Swatinem/rust-cache@v2
      with:
        workspaces: |
          ./rust-runtime -> target
          ./src-tauri -> target
          ./xtask -> target
        cache-workspace-crates: true
        # rust-cache ignores `key` when shared-key is set. Put SDK/target in
        # the effective prefix, including its partial-restore boundary.
        shared-key: ${{ inputs.platform == 'Android' && 'android-test-arm64-api36-ndk27.0.12077973-v1' || format('ios-check-aarch64-apple-ios-{0}-v1', steps.ios-environment.outputs.sdk-key) }}

    - name: Resolve Android libav C cache
      if: inputs.platform == 'Android'
      id: media-key
      shell: bash
      run: |
        echo "BILIKARA_TEST_ANDROID_NDK=$ANDROID_HOME/ndk/27.0.12077973" >> "$GITHUB_ENV"
        echo "BILIKARA_TEST_ANDROID_LIBAV_CACHE=$RUNNER_TEMP/bilikara-android-libav-cache" >> "$GITHUB_ENV"
        cargo run --manifest-path xtask/Cargo.toml --locked --target host-tuple -- android-libav --ndk "$ANDROID_HOME/ndk/27.0.12077973" --abi arm64-v8a --out "$RUNNER_TEMP/android-media-output" --cache "$RUNNER_TEMP/bilikara-android-libav-cache" --cache-key >> "$GITHUB_OUTPUT"

    - name: Restore Android libav C cache
      if: inputs.platform == 'Android'
      id: media-cache
      uses: actions/cache@v4
      with:
        path: ${{ runner.temp }}/bilikara-android-libav-cache
        key: ${{ steps.media-key.outputs.key }}

    - name: Build actual Android media output
      if: inputs.platform == 'Android'
      shell: bash
      run: |
        set -euo pipefail
        cargo run --manifest-path xtask/Cargo.toml --locked --target host-tuple -- android-libav --ndk "$BILIKARA_TEST_ANDROID_NDK" --abi arm64-v8a --out "$RUNNER_TEMP/android-media-output" --cache "$BILIKARA_TEST_ANDROID_LIBAV_CACHE"

    - name: Verify actual Android media libraries and cache
      if: inputs.platform == 'Android'
      env:
        # Qualifies the real-ELF mutation and binary-privacy cases, which skip
        # without real NDK-built libraries.
        BILIKARA_TEST_ANDROID_LIBAV_DIR: ${{ runner.temp }}/android-media-output/jniLibs/arm64-v8a
      shell: bash
      run: |
        set -euo pipefail
        export NDK_HOME="$BILIKARA_TEST_ANDROID_NDK"
        # Includes android_cast_samples (sample B pins) and the A7 checker tests.
        npm run test:android-libav
        # Six libraries (five media + pinned NDK libc++_shared exception), licenses and bound source kit.
        node scripts/android_media_check.mjs --media-output "$RUNNER_TEMP/android-media-output" \
          --readelf "$NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-readelf" \
          --source-kit "$RUNNER_TEMP/android-media-output/sources/bilikara-android-libav-9.0.1-arm64-v8a-source-kit.zip"

    - name: Validate native Host and mobile UI
      # Linux native-host tests belong to Desktop/Linux; Apple SDK checks remain here.
      if: inputs.platform == 'iOS'
      shell: ${{ runner.os == 'Windows' && 'pwsh' || 'bash' }}
      run: |
        cargo fmt --manifest-path rust-runtime/Cargo.toml --check
        cargo clippy --manifest-path rust-runtime/Cargo.toml --features native-host --all-targets --locked -- -D warnings
        cargo test --manifest-path rust-runtime/Cargo.toml --features native-host --locked

    - name: Validate Android signing contract
      if: inputs.platform == 'Android'
      shell: ${{ runner.os == 'Windows' && 'pwsh' || 'bash' }}
      run: BILIKARA_REQUIRE_ANDROID_SIGNING_TESTS=1 node --test tests/android_release.test.mjs

    - name: Compile iOS application target
      if: inputs.platform == 'iOS'
      shell: ${{ runner.os == 'Windows' && 'pwsh' || 'bash' }}
      run: |
        rustup target add aarch64-apple-ios
        # The pinned Tauri CLI aligns manifest features with the iOS config.
        # tauri-build checks that manifest even for a direct Cargo check.
        npm run ios:init -- --skip-targets-install
        node scripts/ios.mjs check

    - name: Validate iOS startup and build entry
      if: inputs.platform == 'iOS'
      shell: ${{ runner.os == 'Windows' && 'pwsh' || 'bash' }}
      run: |
        npm run test:ios-bootstrap
        npm run test:ios-build
        npm run test:ios-signing

    - name: Log Rust test cache
      if: always()
      env:
        CACHE_HIT: ${{ steps.rust-cache.outputs.cache-hit }}
        MOBILE_PLATFORM: ${{ inputs.platform }}
      shell: ${{ runner.os == 'Windows' && 'pwsh' || 'bash' }}
      run: |
        printf '%s test Rust exact cache hit: %s (see restore/save steps for details).\n' "$MOBILE_PLATFORM" "${CACHE_HIT:-unavailable}"

    - uses: ./.github/actions/ci-diagnostics
      if: always()
      with:
        title: ${{ inputs.platform }}
        caches: '{"Rust":"${{ steps.rust-cache.outputs.cache-hit }}","Android libav C":"${{ steps.media-cache.outputs.cache-hit }}"}'

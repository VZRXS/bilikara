[package]
name = "bilikara-xtask"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
publish = false

[dependencies]
libloading = "=0.8.9"
object = { version = "=0.37.3", default-features = false, features = ["std", "read_core", "pe", "unaligned"] }
regex = "1"
serde_json = "1"
sha2 = "=0.10.9"
tempfile = "3"
ureq = { version = "=3.3.0", default-features = false, features = ["cookies"] }
zip = { version = "=2.4.2", default-features = false, features = ["deflate"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_System_JobObjects", "Win32_System_Threading"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[package]
name = "bilikara-media-engine"
version = "0.9.0"
edition = "2021"
rust-version = "1.90"
description = "Native GStreamer playback engine for the bilikara desktop Host"
license = "MIT"
publish = false

# Built as an independent package and linked by the Linux desktop shell.
# It executes one already-authorized program; it never selects Next or
# writes history (see docs/media-backend.md).
[workspace]

[lib]
name = "bilikara_media_engine"
path = "src/lib.rs"

[dependencies]
gstreamer = { version = "=0.23.7", features = ["v1_20"] }
gstreamer-app = { version = "=0.23.5", features = ["v1_20"] }
gstreamer-video = { version = "=0.23.6", features = ["v1_20"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"

[build-dependencies]
cc = "1.2.46"

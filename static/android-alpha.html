<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>bilikara Android Alpha · 启动检查</title>
  <link rel="stylesheet" href="/android-alpha.css" />
  <script src="/android-alpha.js" defer></script>
</head>
<body>
  <main>
    <p>ANDROID HOST ALPHA · 原生 Host</p>
    <h1>原生启动检查</h1>
    <p id="bootstrap-status" role="status" aria-live="polite">正在检查 Rust 运行时…</p>
    <pre id="bootstrap-details" hidden></pre>
    <p>启动成功后会打开与桌面共用的 Host 页面。支持 BV 点歌、分 P 绑定、原唱/伴奏切换，以及局域网手机点歌。</p>
    <p>应用会在自己的私有目录保存和恢复队列、设置与历史。恢复后不会自动续播。如遇存档错误，请先保留应用数据，再排查。</p>
    <p>本版用于前台运行与 HDMI 镜像检查，暂不支持锁屏播放、独立双屏、公网 Remote 和曲库管理。它不启动 Python，不修改桌面端数据。</p>
  </main>
</body>
</html>

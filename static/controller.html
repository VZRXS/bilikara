<!doctype html>
<html lang="zh" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Bilikara Stage</title>
  <link rel="icon" href="/pic/icon.png">
  <link rel="stylesheet" href="/controller.css">
</head>
<body>
  <main class="presentation-output-shell" id="controller-shell" aria-label="Bilikara 副屏播放窗口">
    <div class="presentation-output-frame" id="controller-stage-frame">
      <div class="presentation-output-empty" id="controller-empty">
        <p id="controller-status" role="status" aria-live="polite">正在连接 Host…</p>
      </div>
    </div>
    <div class="presentation-output-control" id="controller-output-control">
      <button type="button" class="presentation-output-exit" id="controller-exit" disabled
        aria-label="手机点歌 / 退出全屏" data-i18n-aria-label="player.fullscreenRemoteExit">
        <span class="presentation-output-action-icons" aria-hidden="true">
          <svg class="presentation-output-phone-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor"
            stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <rect x="7" y="2.5" width="10" height="19" rx="2"></rect>
            <path d="M10 5h4M11 18.5h2"></path>
          </svg>
          <span class="presentation-output-action-divider"></span>
          <svg class="presentation-output-exit-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor"
            stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <path d="M9 4v5H4M15 4v5h5M9 20v-5H4M15 20v-5h5"></path>
          </svg>
        </span>
      </button>
      <div class="presentation-output-remote-popover" id="controller-remote-popover" role="dialog"
        aria-label="手机浏览器打开" data-i18n-aria-label="remote.openInBrowser">
        <div class="presentation-output-remote-card">
          <div class="presentation-output-qr-wrap">
            <img id="controller-remote-qr-image" class="presentation-output-qr-image hidden"
              alt="手机访问二维码" data-i18n-alt="remote.qrAlt">
            <div id="controller-remote-qr-placeholder" class="presentation-output-qr-placeholder"
              data-i18n="remote.qrLoading">正在生成二维码...</div>
          </div>
          <div class="presentation-output-remote-copy">
            <p data-i18n="remote.openInBrowser">手机浏览器打开</p>
            <a id="controller-remote-url-link" href="/remote" target="_blank" rel="noreferrer">/remote</a>
            <small id="controller-remote-url-hint" data-i18n="remote.defaultHint">
              请确保手机和服务端在同一个局域网内。
            </small>
          </div>
        </div>
      </div>
    </div>
    <p class="presentation-output-error hidden" id="controller-error" role="alert"></p>
    <p class="presentation-output-error hidden" id="controller-unavailable" role="alert"
      data-i18n="controller.unavailable">副屏播放窗口不可用，请回到 Host 窗口。</p>
  </main>
  <script src="/presentation-scene.js"></script>
  <script src="/presentation-renderer.js"></script>
  <script src="/presentation-sync.js"></script>
  <script src="/controller.js"></script>
</body>
</html>
